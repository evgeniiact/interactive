<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/iframe-resizer/4.3.6/iframeResizer.contentWindow.min.js"></script>
<style>
:root {
  --bg: #ffffff;
  --card: #ffffff;
  --g50: #f0fdf4;
  --g100: #dcfce7;
  --g600: #16a34a;
  --g700: #15803d;
  --g800: #166534;
  --text: #1e293b;
  --muted: #64748b;
  --border: #e2e8f0;
  --radius: 12px;
  --shadow: 0 4px 12px rgba(0,0,0,0.05);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 16px;
  background: var(--bg);
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
}

.wrap {
  max-width: 720px;
  padding: 20px 16px;
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  margin: 0 auto;
}

/* Кнопки стоят снаружи ленты и не наезжают на карточки */
.carousel {
  display: flex;
  align-items: center;
  gap: 10px;
}

.nav-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 2px solid var(--border);
  background: #fff;
  color: var(--muted);
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}

.nav-btn:hover {
  border-color: var(--g600);
  color: var(--g700);
  background: var(--g50);
}

.nav-btn:active {
  transform: scale(0.94);
}

/* В окне ровно две карточки, без размытия и перекрытий */
.viewport {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  padding: 6px 2px 10px;
}

.track {
  display: flex;
  gap: 16px;
  transition: transform 0.45s ease;
  will-change: transform;
}

.track.no-anim {
  transition: none;
}

.fcard {
  width: calc((100% - 16px) / 2);
  height: 210px;
  flex-shrink: 0;
  perspective: 1000px;
  cursor: pointer;
}

.fcard-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform 0.6s;
  transform-style: preserve-3d;
}

.fcard.flipped .fcard-inner {
  transform: rotateY(180deg);
}

.face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: var(--radius);
  padding: 14px 16px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
}

.face.front {
  background: #fff;
}

.face.back {
  background: var(--g50);
  border-color: var(--g100);
  transform: rotateY(180deg);
}

.face .tag {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  color: var(--muted);
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.face .txt {
  font-size: 14px;
  line-height: 1.45;
  font-weight: 600;
  color: var(--text);
}

.b-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  color: var(--g700);
  margin-bottom: 3px;
}

.b-label.mt {
  margin-top: 8px;
}

.b-value {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
}

.b-prompt {
  font-size: 12px;
  line-height: 1.4;
  color: var(--text);
  background: #fff;
  border: 1px solid var(--g100);
  border-radius: 6px;
  padding: 6px 8px;
}

.flip-hint {
  margin-top: auto;
  padding-top: 8px;
  font-size: 11px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 5px;
}

@media (max-width: 600px) {
  .wrap { padding: 14px 10px; }
  .fcard { width: 100%; height: 230px; }
  .nav-btn { width: 34px; height: 34px; }
  .carousel { gap: 6px; }
}
</style>
</head>
<body>

<div class="wrap" id="wrap">
  <div class="carousel">
    <button class="nav-btn" id="prev-btn" aria-label="Предыдущая карточка">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div class="viewport" id="viewport">
      <div class="track" id="track"></div>
    </div>

    <button class="nav-btn" id="next-btn" aria-label="Следующая карточка">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</div>

<script>
function triggerResize() {
  if (window.iFrameResize) {
    window.iFrameResize({ log: false, checkOrigin: false }, '*');
  }
}

var data = [
  { s: 'Регулярно запрашиваете у цехов данные. В каждом письме меняются период, срок, адресат и перечень сведений. Структура письма остается одинаковой.',
    r: 'Шаблон регулярного письма',
    p: 'Подготовь шаблон письма для запроса данных у подразделения. Оставь поля: [адресат], [цель], [период], [перечень сведений], [срок], [формат ответа], [приложение]. Используй деловой и нейтральный стиль. Не добавляй требования, сроки, реквизиты и обязательства, которых нет в запросе.' },
  { s: 'Есть согласованный текст об изменении порядка накопления отходов. Работникам цеха нужно объяснить, что изменилось, что они должны делать и какие действия запрещены.',
    r: 'Краткая памятка для работников',
    p: 'Адаптируй согласованный текст в памятку для работников цеха. Оставь действия, запреты, сроки и условия. Используй короткие предложения и список действий. Не меняй факты, требования, сроки, условия и обязательные термины.' },
  { s: 'По тому же изменению нужно подготовить сообщение для начальника подразделения. Начальнику нужно понять, что организовать, кого проинформировать и что проверить.',
    r: 'Сообщение для руководителя подразделения',
    p: 'Подготовь сообщение для начальника подразделения на основе согласованного текста. Укажи, что нужно организовать, проконтролировать и подтвердить. Не меняй требования, сроки, условия и обязательные термины. Не добавляй новые обязанности и ответственность.' },
  { s: 'После обхода информация находится в журнале, таблице контроля, письмах подразделений и заметках после совещания.Руководителю нужно коротко сообщить о ситуации, выполненных действиях и вопросе, который требует решения.',
    r: 'Черновик служебной записки',
    p: 'Собери проверенные материалы в черновик служебной записки. Используй структуру: ситуация, подтвержденные факты, выполненные действия, вопрос для решения. Не добавляй причины, выводы, сроки и обязательства, которых нет в исходных материалах. Если информации недостаточно, составь список вопросов для уточнения.' }, }
];

var K = 3;
var N = data.length;
var track = document.getElementById('track');
var pos = K;
var step = 0;

var qIcon = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.5"/><path d="M6.2 6.2c.3-1 1.2-1.5 2-1.4 1 0 1.8.8 1.8 1.7 0 1.2-1.5 1.5-1.9 2.3M8 11.2v.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
var cIcon = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 8.2l1.8 1.8 3.4-3.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var fIcon = '<svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M13 8a5 5 0 0 1-9 3M3 8a5 5 0 0 1 9-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M12 5.5V8H9.5M4 10.5V8h2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function cardEl(id) {
  var d = data[id];
  var el = document.createElement('div');
  el.className = 'fcard';
  el.setAttribute('data-id', id);
  el.innerHTML =
    '<div class="fcard-inner">' +
      '<div class="face front">' +
        '<div class="tag">Ситуация ' + qIcon + '</div>' +
        '<div class="txt">' + d.s + '</div>' +
        '<div class="flip-hint">Перевернуть ' + fIcon + '</div>' +
      '</div>' +
      '<div class="face back">' +
        '<div class="b-label">Результат от ИИ</div>' +
        '<div class="b-value">' + d.r + '</div>' +
        '<div class="b-label mt">Пример промпта</div>' +
        '<div class="b-prompt">' + d.p + '</div>' +
        '<div class="flip-hint">Перевернуть ' + fIcon + '</div>' +
      '</div>' +
    '</div>';
  return el;
}

function build() {
  track.innerHTML = '';
  for (var i = -K; i < N + K; i++) {
    var id = ((i % N) + N) % N;
    track.appendChild(cardEl(id));
  }
}

function measure() {
  var card = track.querySelector('.fcard');
  var gap = parseFloat(getComputedStyle(track).gap) || 16;
  step = card.offsetWidth + gap;
}

function jump() {
  track.classList.add('no-anim');
  track.style.transform = 'translateX(' + (-pos * step) + 'px)';
  void track.offsetWidth;
  track.classList.remove('no-anim');
}

function move() {
  track.style.transform = 'translateX(' + (-pos * step) + 'px)';
}

function normalize() {
  var changed = false;
  while (pos > N - 1 + K) { pos -= N; changed = true; }
  while (pos < K) { pos += N; changed = true; }
  if (changed) jump();
}

track.addEventListener('transitionend', function(e) {
  if (e.propertyName !== 'transform') return;
  normalize();
});

document.getElementById('next-btn').addEventListener('click', function() {
  pos++;
  move();
});

document.getElementById('prev-btn').addEventListener('click', function() {
  pos--;
  move();
});

track.addEventListener('click', function(e) {
  var card = e.target.closest('.fcard');
  if (!card) return;
  var id = card.getAttribute('data-id');
  var flipped = !card.classList.contains('flipped');
  track.querySelectorAll('.fcard[data-id="' + id + '"]').forEach(function(c) {
    c.classList.toggle('flipped', flipped);
  });
});

window.addEventListener('resize', function() {
  measure();
  jump();
  triggerResize();
});

document.addEventListener('DOMContentLoaded', function() {
  build();
  measure();
  jump();
  triggerResize();

  var wrap = document.getElementById('wrap');
  if (wrap) {
    new ResizeObserver(function() {
      triggerResize();
    }).observe(wrap);
  }
});
</script>

</body>
</html>
