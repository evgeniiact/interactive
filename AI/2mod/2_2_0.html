<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/iframe-resizer/4.3.6/iframeResizer.contentWindow.min.js"></script>
<style>
:root {
  --bg: #ffffff;
  --card: #ffffff;
  --g50: #f0fdf4;
  --g100: #dcfce7;
  --g600: #16a34a;
  --g700: #15803d;
  --g800: #166534;
  --o50: #fff7ed;
  --o600: #ea580c;
  --o800: #9a3412;
  --bl50: #eff6ff;
  --bl600: #2563eb;
  --bl700: #1d4ed8;
  --p50: #f5f3ff;
  --p600: #7c3aed;
  --p700: #6d28d9;
  --text: #1e293b;
  --muted: #64748b;
  --border: #e2e8f0;
  --radius: 12px;
  --shadow: 0 4px 12px rgba(0,0,0,0.05);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 16px;
  background: var(--bg);
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
}

.wrap {
  max-width: 720px;
  min-height: 300px;
  padding: 20px;
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  margin: 0 auto;
}

.steps {
  display: flex;
  align-items: stretch;
  gap: 8px;
  margin-bottom: 14px;
}

.step {
  flex: 1;
  min-width: 0;
  background: #fff;
  border: 2px solid var(--border);
  border-radius: 10px;
  padding: 14px 10px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  text-align: center;
  transition: all 0.2s;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.35;
}

.step:hover {
  border-color: var(--muted);
  background: #fafafa;
}

.step:focus {
  outline: 2px solid var(--bl600);
  outline-offset: 2px;
}

.step-icon {
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: #f1f5f9;
  color: var(--muted);
  flex-shrink: 0;
  transition: all 0.2s;
}

.step-icon svg {
  width: 15px;
  height: 15px;
}

.step.blue.active { border-color: var(--bl600); background: var(--bl50); color: var(--bl700); }
.step.blue.active .step-icon { background: var(--bl600); color: #fff; }
.step.green.active { border-color: var(--g600); background: var(--g50); color: var(--g800); }
.step.green.active .step-icon { background: var(--g600); color: #fff; }
.step.orange.active { border-color: var(--o600); background: var(--o50); color: var(--o800); }
.step.orange.active .step-icon { background: var(--o600); color: #fff; }
.step.purple.active { border-color: var(--p600); background: var(--p50); color: var(--p700); }
.step.purple.active .step-icon { background: var(--p600); color: #fff; }

.arrow {
  display: flex;
  align-items: center;
  color: #94a3b8;
  flex-shrink: 0;
}

.detail {
  background: #fff;
  border: 1px solid var(--border);
  border-left: 4px solid var(--g600);
  border-radius: 10px;
  padding: 16px;
  animation: fadeIn 0.3s ease;
  display: none;
}

.detail.visible {
  display: block;
}

.detail-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  margin: 0 0 8px 0;
}

.detail-text {
  font-size: 14px;
  line-height: 1.5;
  color: var(--text);
  margin: 0 0 12px 0;
}

.help-box {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  background: var(--g50);
  border: 1px solid var(--g100);
  border-radius: 8px;
  padding: 12px 14px;
}

.help-icon {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--g100);
  color: var(--g700);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.help-icon svg {
  width: 14px;
  height: 14px;
}

.help-label {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  color: var(--g700);
  margin-bottom: 3px;
}

.help-text {
  font-size: 13px;
  line-height: 1.5;
  color: var(--text);
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 600px) {
  .wrap { padding: 14px; }
  .steps { flex-direction: column; gap: 6px; }
  .step {
    flex-direction: row;
    justify-content: flex-start;
    text-align: left;
    gap: 10px;
    padding: 12px;
  }
  .arrow {
    justify-content: center;
    transform: rotate(90deg);
    height: 14px;
  }
}
</style>
</head>
<body>

<div class="wrap" id="wrap">

  <div class="steps" id="steps" role="tablist">
    <button class="step blue" data-id="0" role="tab" aria-expanded="false">
      <span class="step-icon">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="7" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M9 7V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v1M3 12h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </span>
      <span>Подготовка к совещанию</span>
    </button>

    <span class="arrow" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 8h10M9 4.5L12.5 8 9 11.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>

    <button class="step green" data-id="1" role="tab" aria-expanded="false">
      <span class="step-icon">
        <svg viewBox="0 0 24 24" fill="none"><path d="M6 3h9l4 4v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="11" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M13.5 14.5 16 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </span>
      <span>Быстрый разбор нового документа</span>
    </button>

    <span class="arrow" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 8h10M9 4.5L12.5 8 9 11.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>

    <button class="step orange" data-id="2" role="tab" aria-expanded="false">
      <span class="step-icon">
        <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M4 10h16M4 15h16M10 4v16" stroke="currentColor" stroke-width="1.8"/></svg>
      </span>
      <span>Подготовка таблицы действий</span>
    </button>

    <span class="arrow" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 8h10M9 4.5L12.5 8 9 11.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>

    <button class="step purple" data-id="3" role="tab" aria-expanded="false">
      <span class="step-icon">
        <svg viewBox="0 0 24 24" fill="none"><path d="M16 3.5 20 7.5l-4 4M20 7.5H7M8 20.5l-4-4 4-4M4 16.5h13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span>Сравнение двух редакций</span>
    </button>
  </div>

  <div class="detail" id="detail">
    <div class="detail-title" id="detail-title"></div>
    <div class="detail-text" id="detail-text"></div>
    <div class="help-box">
      <span class="help-icon">
        <svg viewBox="0 0 24 24" fill="none"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 1 6 6c0 2-1 3.4-2 4.5-.6.7-1 1.5-1 2.5h-6c0-1-.4-1.8-1-2.5C7 12.4 6 11 6 9a6 6 0 0 1 6-6Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <div>
        <div class="help-label">Как поможет ИИ</div>
        <div class="help-text" id="help-text"></div>
      </div>
    </div>
  </div>

</div>

<script>
function triggerResize() {
  if (window.iFrameResize) {
    window.iFrameResize({ log: false, checkOrigin: false }, '*');
  }
}

var cards = [
  {
    colorVar: 'var(--bl600)',
    title: 'Подготовка к совещанию',
    situation: 'Перед совещанием прислали новый регламент по обходу контейнерных площадок. Нужно быстро разобраться, какие требования появились, что изменилось в сроках и какие вопросы обсудить с коллегами.',
    help: 'ИИ выделит основные изменения и соберет короткую выжимку. Вы придете на встречу с понятной картиной документа, а не с десятками непрочитанных страниц.'
  },
  {
    colorVar: 'var(--g600)',
    title: 'Быстрый разбор нового документа',
    situation: 'В отдел поступил новый приказ, проект внутреннего регламента или разъяснение надзорного органа. В документе много текста, но для работы важны только требования, сроки, условия и исключения.',
    help: 'ИИ быстро найдет эти сведения и соберет первый разбор. Вы поймете, какие разделы нужно изучить подробно и что проверить в первую очередь.'
  },
  {
    colorVar: 'var(--o600)',
    title: 'Подготовка таблицы действий',
    situation: 'Новый порядок требует собрать сведения от цехов, проверить контейнерные площадки или подготовить документы к внутреннему аудиту. Нужно разложить требования на конкретные действия и не пропустить срок.',
    help: 'ИИ превратит текст документа в рабочую таблицу. В ней можно собрать действия, сроки, ответственных и точки контроля.'
  },
  {
    colorVar: 'var(--p600)',
    title: 'Сравнение двух редакций',
    situation: 'Вам прислали старую и новую версии инструкции по обращению с отходами. Нужно понять, какие пункты изменились, появились ли новые формы, сроки или требования к подразделениям.',
    help: 'ИИ сопоставит одинаковые разделы и выделит различия. Это ускорит подготовку таблицы изменений для руководителя или коллег.'
  }
];

var activeId = null;

function toggle(id) {
  var steps = document.querySelectorAll('.step');
  var detail = document.getElementById('detail');

  if (activeId === id) {
    steps.forEach(function(s) {
      s.classList.remove('active');
      s.setAttribute('aria-expanded', 'false');
    });
    detail.classList.remove('visible');
    activeId = null;
    triggerResize();
    return;
  }

  steps.forEach(function(s) {
    s.classList.remove('active');
    s.setAttribute('aria-expanded', 'false');
  });

  var btn = document.querySelector('.step[data-id="' + id + '"]');
  btn.classList.add('active');
  btn.setAttribute('aria-expanded', 'true');

  var c = cards[id];

  detail.classList.remove('visible');
  void detail.offsetWidth;

  document.getElementById('detail-title').textContent = c.title;
  document.getElementById('detail-text').textContent = c.situation;
  document.getElementById('help-text').textContent = c.help;
  detail.style.borderLeftColor = c.colorVar;

  detail.classList.add('visible');
  activeId = id;

  triggerResize();
}

document.querySelectorAll('.step').forEach(function(btn) {
  btn.addEventListener('click', function() {
    toggle(btn.getAttribute('data-id'));
  });
});

document.addEventListener('DOMContentLoaded', function() {
  triggerResize();

  var wrap = document.getElementById('wrap');
  if (wrap) {
    new ResizeObserver(function() {
      triggerResize();
    }).observe(wrap);
  }
});
</script>

</body>
</html>
