<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/iframe-resizer/4.3.6/iframeResizer.contentWindow.min.js"></script>
<style>
:root {
  --bg: #ffffff;
  --card: #ffffff;
  --g50: #f0fdf4;
  --g100: #dcfce7;
  --g600: #16a34a;
  --g700: #15803d;
  --g800: #166534;
  --o50: #fff7ed;
  --o600: #ea580c;
  --o800: #9a3412;
  --bl50: #eff6ff;
  --bl600: #2563eb;
  --bl700: #1d4ed8;
  --p50: #f5f3ff;
  --p600: #7c3aed;
  --p700: #6d28d9;
  --text: #1e293b;
  --muted: #64748b;
  --border: #e2e8f0;
  --radius: 12px;
  --shadow: 0 4px 12px rgba(0,0,0,0.05);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 16px;
  background: var(--bg);
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
}

.wrap {
  max-width: 720px;
  padding: 20px;
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  margin: 0 auto;
}

.steps {
  display: flex;
  align-items: stretch;
  gap: 10px;
  margin-bottom: 0;
}

.step {
  flex: 1;
  min-width: 0;
  background: #fff;
  border: 2px solid var(--border);
  border-radius: 10px;
  padding: 14px 10px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  text-align: center;
  transition: all 0.2s;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.35;
}

.step:hover {
  border-color: var(--muted);
  background: #fafafa;
}

.step:focus {
  outline: 2px solid var(--bl600);
  outline-offset: 2px;
}

.step-icon {
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: #f1f5f9;
  color: var(--muted);
  flex-shrink: 0;
  transition: all 0.2s;
}

.step-icon svg {
  width: 15px;
  height: 15px;
}

.step.blue.active { border-color: var(--bl600); background: var(--bl50); color: var(--bl700); }
.step.blue.active .step-icon { background: var(--bl600); color: #fff; }
.step.green.active { border-color: var(--g600); background: var(--g50); color: var(--g800); }
.step.green.active .step-icon { background: var(--g600); color: #fff; }

.detail {
  background: #fff;
  border: 1px solid var(--border);
  border-left: 4px solid var(--g600);
  border-radius: 10px;
  padding: 16px;
  margin-top: 14px;
  animation: fadeIn 0.3s ease;
  display: none;
}

.detail.visible {
  display: block;
}

.detail-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  margin: 0 0 8px 0;
}

.detail-text {
  font-size: 14px;
  line-height: 1.5;
  color: var(--text);
  margin: 0 0 12px 0;
}

.help-box {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  background: var(--g50);
  border: 1px solid var(--g100);
  border-radius: 8px;
  padding: 12px 14px;
  margin-bottom: 10px;
}

.help-box:last-child {
  margin-bottom: 0;
}

.help-icon {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--g100);
  color: var(--g700);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.help-icon svg {
  width: 14px;
  height: 14px;
}

.help-label {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  color: var(--g700);
  margin-bottom: 3px;
}

.help-text {
  font-size: 13px;
  line-height: 1.5;
  color: var(--text);
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 600px) {
  .wrap { padding: 14px; }
  .steps { flex-direction: column; gap: 8px; }
  .step {
    flex-direction: row;
    justify-content: flex-start;
    text-align: left;
    gap: 10px;
    padding: 12px;
  }
}
</style>
</head>
<body>

<div class="wrap" id="wrap">

  <div class="steps" id="steps" role="tablist">
    <button class="step blue" data-id="0" role="tab" aria-expanded="false">
      <span class="step-icon">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" ry="2" stroke="currentColor" stroke-width="2"/><circle cx="8.5" cy="8.5" r="1.5" stroke="currentColor" stroke-width="2"/><polyline points="21 15 16 10 5 21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span>Плакат и памятка</span>
    </button>

    <button class="step green" data-id="1" role="tab" aria-expanded="false">
      <span class="step-icon">
        <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="3" width="20" height="14" rx="2" ry="2" stroke="currentColor" stroke-width="2"/><line x1="8" y1="21" x2="16" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="17" x2="12" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </span>
      <span>Презентация для инструктажа</span>
    </button>
  </div>

  <div class="detail" id="detail">
    <div class="detail-title" id="detail-title"></div>
    <div class="detail-text" id="detail-text"></div>
    <div class="help-box">
      <span class="help-icon">
        <svg viewBox="0 0 24 24" fill="none"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <div>
        <div class="help-label">Как поможет ИИ</div>
        <div class="help-text" id="help-text"></div>
      </div>
    </div>
    <div class="help-box">
      <span class="help-icon">
        <svg viewBox="0 0 24 24" fill="none"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <div>
        <div class="help-label">Что добавить вручную</div>
        <div class="help-text" id="manual-text"></div>
      </div>
    </div>
  </div>

</div>

<script>
function triggerResize() {
  if (window.iFrameResize) {
    window.iFrameResize({ log: false, checkOrigin: false }, '*');
  }
}

var cards = [
  {
    colorVar: 'var(--bl600)',
    title: 'Плакат и памятка',
    situation: 'На участке изменили порядок накопления отходов. Работникам нужно объяснить, какие отходы складывать в каждую емкость и кому сообщать о переполнении.',
    help: 'Создаст иллюстрацию, набор пиктограмм или визуальную основу плаката. Оставит свободное поле для заголовка и коротких правил.',
    manual: 'Наименования отходов, маркировку емкостей, порядок действий, контакты ответственного и логотип предприятия.'
  },
  {
    colorVar: 'var(--g600)',
    title: 'Презентация для инструктажа',
    situation: 'Нужно провести инструктаж по экологической грамотности на участке.',
    help: 'Подготовит структуру презентации, черновики слайдов, иллюстрации и единый стиль оформления.',
    manual: 'Схемы, утвержденные сроки, названия документов, ответственных сотрудников и сведения о конкретной площадке.'
  }
];

var activeId = null;

function toggle(id) {
  var steps = document.querySelectorAll('.step');
  var detail = document.getElementById('detail');

  if (activeId === id) {
    steps.forEach(function(s) {
      s.classList.remove('active');
      s.setAttribute('aria-expanded', 'false');
    });
    detail.classList.remove('visible');
    activeId = null;
    triggerResize();
    return;
  }

  steps.forEach(function(s) {
    s.classList.remove('active');
    s.setAttribute('aria-expanded', 'false');
  });

  var btn = document.querySelector('.step[data-id="' + id + '"]');
  btn.classList.add('active');
  btn.setAttribute('aria-expanded', 'true');

  var c = cards[id];

  detail.classList.remove('visible');
  void detail.offsetWidth;

  document.getElementById('detail-title').textContent = c.title;
  document.getElementById('detail-text').textContent = c.situation;
  document.getElementById('help-text').textContent = c.help;
  document.getElementById('manual-text').textContent = c.manual;
  detail.style.borderLeftColor = c.colorVar;

  detail.classList.add('visible');
  activeId = id;

  triggerResize();
}

document.querySelectorAll('.step').forEach(function(btn) {
  btn.addEventListener('click', function() {
    toggle(btn.getAttribute('data-id'));
  });
});

document.addEventListener('DOMContentLoaded', function() {
  triggerResize();

  var wrap = document.getElementById('wrap');
  if (wrap) {
    new ResizeObserver(function() {
      triggerResize();
    }).observe(wrap);
  }
});
</script>

</body>
</html>
