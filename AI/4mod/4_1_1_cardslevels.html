<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/iframe-resizer/4.3.6/iframeResizer.contentWindow.min.js"></script>
<style>
:root {
  --bg: #ffffff;
  --card: #ffffff;
  --g50: #f0fdf4;
  --g100: #dcfce7;
  --g600: #16a34a;
  --g700: #15803d;
  --g800: #166534;
  --o50: #fff7ed;
  --o600: #ea580c;
  --o800: #9a3412;
  --bl50: #eff6ff;
  --bl600: #2563eb;
  --bl700: #1d4ed8;
  --p50: #f5f3ff;
  --p600: #7c3aed;
  --p700: #6d28d9;
  --t50: #f0fdfa;
  --t600: #0d9488;
  --t700: #0f766e;
  --text: #1e293b;
  --muted: #64748b;
  --border: #e2e8f0;
  --radius: 12px;
  --shadow: 0 4px 12px rgba(0,0,0,0.05);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 16px;
  background: var(--bg);
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
}

.wrap {
  max-width: 720px;
  padding: 20px;
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  margin: 0 auto;
}

.steps {
  display: flex;
  align-items: stretch;
  gap: 10px;
  margin-bottom: 0;
  flex-wrap: wrap;
}

.step {
  flex: 1;
  min-width: 120px;
  background: #fff;
  border: 2px solid var(--border);
  border-radius: 10px;
  padding: 14px 10px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  text-align: center;
  transition: all 0.2s;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.35;
}

.step:hover {
  border-color: var(--muted);
  background: #fafafa;
}

.step:focus {
  outline: 2px solid var(--bl600);
  outline-offset: 2px;
}

.step-icon {
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: #f1f5f9;
  color: var(--muted);
  flex-shrink: 0;
  transition: all 0.2s;
}

.step-icon svg {
  width: 15px;
  height: 15px;
}

.step.blue.active { border-color: var(--bl600); background: var(--bl50); color: var(--bl700); }
.step.blue.active .step-icon { background: var(--bl600); color: #fff; }
.step.green.active { border-color: var(--g600); background: var(--g50); color: var(--g800); }
.step.green.active .step-icon { background: var(--g600); color: #fff; }
.step.orange.active { border-color: var(--o600); background: var(--o50); color: var(--o800); }
.step.orange.active .step-icon { background: var(--o600); color: #fff; }
.step.purple.active { border-color: var(--p600); background: var(--p50); color: var(--p700); }
.step.purple.active .step-icon { background: var(--p600); color: #fff; }
.step.teal.active { border-color: var(--t600); background: var(--t50); color: var(--t700); }
.step.teal.active .step-icon { background: var(--t600); color: #fff; }

.detail {
  background: #fff;
  border: 1px solid var(--border);
  border-left: 4px solid var(--g600);
  border-radius: 10px;
  padding: 16px;
  margin-top: 14px;
  animation: fadeIn 0.3s ease;
  display: none;
}

.detail.visible {
  display: block;
}

.detail-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  margin: 0 0 8px 0;
}

.detail-text {
  font-size: 14px;
  line-height: 1.5;
  color: var(--text);
  margin: 0 0 12px 0;
}

.help-box {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  background: var(--g50);
  border: 1px solid var(--g100);
  border-radius: 8px;
  padding: 12px 14px;
  margin-bottom: 10px;
}

.help-box:last-child {
  margin-bottom: 0;
}

.help-icon {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--g100);
  color: var(--g700);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.help-icon svg {
  width: 14px;
  height: 14px;
}

.help-label {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  color: var(--g700);
  margin-bottom: 3px;
}

.help-text {
  font-size: 13px;
  line-height: 1.5;
  color: var(--text);
}

.conclusion {
  background: var(--bl50);
  border: 1px solid #dbeafe;
  border-radius: 10px;
  padding: 16px;
  margin-top: 16px;
}

.conclusion-text {
  font-size: 13px;
  line-height: 1.5;
  color: var(--text);
  margin: 0;
  font-weight: 500;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 600px) {
  .wrap { padding: 14px; }
  .steps { flex-direction: column; gap: 8px; }
  .step {
    flex-direction: row;
    justify-content: flex-start;
    text-align: left;
    gap: 10px;
    padding: 12px;
  }
}
</style>
</head>
<body>

<div class="wrap" id="wrap">

  <div class="steps" id="steps" role="tablist">
    <button class="step blue" data-id="0" role="tab" aria-expanded="false">
      <span class="step-icon">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2"/><path d="M9 9h6M9 13h6M9 17h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </span>
      <span>Чистый лист</span>
    </button>

    <button class="step green" data-id="1" role="tab" aria-expanded="false">
      <span class="step-icon">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </span>
      <span>Брейншторм</span>
    </button>

    <button class="step orange" data-id="2" role="tab" aria-expanded="false">
      <span class="step-icon">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span>Декомпозиция</span>
    </button>

    <button class="step purple" data-id="3" role="tab" aria-expanded="false">
      <span class="step-icon">
        <svg viewBox="0 0 24 24" fill="none"><path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke="currentColor" stroke-width="2"/><path d="M12 8v4l3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </span>
      <span>Итерации</span>
    </button>

    <button class="step teal" data-id="4" role="tab" aria-expanded="false">
      <span class="step-icon">
        <svg viewBox="0 0 24 24" fill="none"><path d="M9 11l3 3L22 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span>Карта проверки</span>
    </button>
  </div>

  <div class="detail" id="detail">
    <div class="detail-title" id="detail-title"></div>
    <div class="detail-text" id="detail-text"></div>
    <div class="help-box">
      <span class="help-icon">
        <svg viewBox="0 0 24 24" fill="none"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <div>
        <div class="help-label">Как помогает ИИ</div>
        <div class="help-text" id="help-text"></div>
      </div>
    </div>
    <div class="help-box">
      <span class="help-icon">
        <svg viewBox="0 0 24 24" fill="none"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="22 4 12 14.01 9 11.01" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <div>
        <div class="help-label">Результат</div>
        <div class="help-text" id="result-text"></div>
      </div>
    </div>
  </div>


</div>

<script>
function triggerResize() {
  if (window.iFrameResize) {
    window.iFrameResize({ log: false, checkOrigin: false }, '*');
  }
}

var cards = [
  {
    colorVar: 'var(--bl600)',
    title: 'Чистый лист',
    situation: 'Есть рабочая ситуация, но пока неясно, с чего начать.',
    help: 'ИИ задает вопросы и помогает определить границы задачи.',
    result: 'Список вопросов и первый план действий.'
  },
  {
    colorVar: 'var(--g600)',
    title: 'Брейншторм',
    situation: 'Нужно выбрать один вариант из нескольких.',
    help: 'ИИ предлагает варианты по заданным критериям.',
    result: 'Несколько идей для выбора.'
  },
  {
    colorVar: 'var(--o600)',
    title: 'Декомпозиция',
    situation: 'Задача включает несколько действий и участников.',
    help: 'ИИ делит большую задачу на короткие этапы.',
    result: 'Последовательный план работы.'
  },
  {
    colorVar: 'var(--p600)',
    title: 'Итерации',
    situation: 'Первый черновик полезен, но требует доработки.',
    help: 'ИИ улучшает один конкретный элемент: объем, структуру, тон, формат или понятность.',
    result: 'Следующая версия, которую удобно сравнить с предыдущей.'
  },
  {
    colorVar: 'var(--t600)',
    title: 'Карта проверки',
    situation: 'В ответе появились точные факты, сроки или выводы.',
    help: 'ИИ выделяет утверждения, которые требуют отдельного подтверждения.',
    result: 'Список фрагментов для ручной проверки.'
  }
];

var activeId = null;

function toggle(id) {
  var steps = document.querySelectorAll('.step');
  var detail = document.getElementById('detail');

  if (activeId === id) {
    steps.forEach(function(s) {
      s.classList.remove('active');
      s.setAttribute('aria-expanded', 'false');
    });
    detail.classList.remove('visible');
    activeId = null;
    triggerResize();
    return;
  }

  steps.forEach(function(s) {
    s.classList.remove('active');
    s.setAttribute('aria-expanded', 'false');
  });

  var btn = document.querySelector('.step[data-id="' + id + '"]');
  btn.classList.add('active');
  btn.setAttribute('aria-expanded', 'true');

  var c = cards[id];

  detail.classList.remove('visible');
  void detail.offsetWidth;

  document.getElementById('detail-title').textContent = c.title;
  document.getElementById('detail-text').textContent = c.situation;
  document.getElementById('help-text').textContent = c.help;
  document.getElementById('result-text').textContent = c.result;
  detail.style.borderLeftColor = c.colorVar;

  detail.classList.add('visible');
  activeId = id;

  triggerResize();
}

document.querySelectorAll('.step').forEach(function(btn) {
  btn.addEventListener('click', function() {
    toggle(btn.getAttribute('data-id'));
  });
});

document.addEventListener('DOMContentLoaded', function() {
  triggerResize();

  var wrap = document.getElementById('wrap');
  if (wrap) {
    new ResizeObserver(function() {
      triggerResize();
    }).observe(wrap);
  }
});
</script>

</body>
</html>
