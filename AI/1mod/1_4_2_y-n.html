<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/iframe-resizer/4.3.6/iframeResizer.contentWindow.min.js"></script>
<style>
:root {
  --bg: #ffffff;
  --card: #ffffff;
  --g50: #f0fdf4;
  --g100: #dcfce7;
  --g600: #16a34a;
  --g700: #15803d;
  --g800: #166534;
  --o50: #fff7ed;
  --o100: #ffedd5;
  --o600: #ea580c;
  --o800: #9a3412;
  --b50: #eff6ff;
  --b100: #dbeafe;
  --b600: #2563eb;
  --b700: #1d4ed8;
  --text: #1e293b;
  --muted: #64748b;
  --border: #e2e8f0;
  --radius: 12px;
  --shadow: 0 4px 12px rgba(0,0,0,0.05);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 16px;
  background: var(--bg);
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
}

.wrap {
  max-width: 650px;
  min-height: 300px;
  padding: 24px;
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  margin: 0 auto;
}

.header-title {
  font-size: 19px;
  font-weight: 700;
  color: var(--g800);
  margin: 0 0 6px 0;
}

.header-text {
  font-size: 14px;
  color: var(--muted);
  margin: 0 0 16px 0;
  line-height: 1.5;
}

.prog-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}

.prog-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  white-space: nowrap;
}

.prog-track {
  flex: 1;
  height: 6px;
  background: #e2e8f0;
  border-radius: 3px;
  overflow: hidden;
}

.prog-fill {
  height: 100%;
  background: var(--g600);
  border-radius: 3px;
  transition: width 0.4s;
  width: 0%;
}

.prog-count {
  font-size: 12px;
  font-weight: 700;
  color: var(--g700);
  white-space: nowrap;
}

.question-block {
  animation: fadeIn 0.3s ease;
}

.situation {
  background: #f8fafc;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
  margin-bottom: 14px;
  font-size: 14px;
  line-height: 1.5;
  color: var(--text);
}

.question {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  margin: 0 0 12px 0;
}

.options {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}

.opt-btn {
  flex: 1;
  padding: 12px;
  border: 2px solid var(--border);
  border-radius: 8px;
  background: #fff;
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  line-height: 1.4;
}

.opt-btn:hover:not(.disabled) {
  border-color: var(--g600);
  background: var(--g50);
}

.opt-btn.selected-correct {
  border-color: var(--g600);
  background: var(--g100);
  color: var(--g800);
  cursor: default;
}

.opt-btn.selected-wrong {
  border-color: var(--o600);
  background: var(--o100);
  color: var(--o800);
  cursor: default;
}

.opt-btn.disabled {
  opacity: 0.5;
  pointer-events: none;
}

.explanation {
  padding: 14px;
  border-radius: 8px;
  border-left: 4px solid var(--g600);
  background: var(--g50);
  font-size: 14px;
  line-height: 1.5;
  margin-bottom: 10px;
  animation: fadeIn 0.3s ease;
  display: none;
}

.explanation.visible {
  display: block;
}

.explanation.wrong {
  border-left-color: var(--o600);
  background: var(--o50);
}

.explanation .label {
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  margin-bottom: 6px;
  color: var(--g700);
}

.explanation.wrong .label {
  color: var(--o800);
}

.comment {
  padding: 12px 14px;
  border-radius: 8px;
  border-left: 4px solid var(--b600);
  background: var(--b50);
  font-size: 13px;
  line-height: 1.5;
  margin-bottom: 12px;
  animation: fadeIn 0.3s ease;
  display: none;
}

.comment.visible {
  display: block;
}

.comment .label {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  margin-bottom: 4px;
  color: var(--b700);
}

.prompt-toggle-btn {
  display: none;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  border: 2px solid var(--g600);
  border-radius: 8px;
  background: #fff;
  color: var(--g700);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  margin-bottom: 12px;
}

.prompt-toggle-btn.visible {
  display: inline-flex;
}

.prompt-toggle-btn:hover {
  background: var(--g50);
}

.prompt-block {
  background: var(--g50);
  border: 1px solid var(--g100);
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 12px;
  animation: fadeIn 0.3s ease;
  display: none;
}

.prompt-block.open {
  display: block;
}

.prompt-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--g800);
  margin: 0 0 6px 0;
}

.prompt-note {
  font-size: 12px;
  color: var(--muted);
  margin: 0 0 10px 0;
  line-height: 1.4;
}

.prompt-text {
  font-size: 13px;
  line-height: 1.55;
  color: var(--text);
  white-space: pre-line;
  margin: 0 0 12px 0;
}

.copy-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 10px 16px;
  border: 2px solid var(--g600);
  border-radius: 8px;
  background: #fff;
  color: var(--g700);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}

.copy-btn:hover {
  background: var(--g100);
}

.copy-btn.copied {
  background: var(--g600);
  color: #fff;
}

.next-btn {
  padding: 10px 24px;
  border: none;
  border-radius: 8px;
  background: var(--g600);
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
  font-family: inherit;
  opacity: 0.3;
  pointer-events: none;
}

.next-btn.active {
  opacity: 1;
  pointer-events: auto;
}

.next-btn.active:hover {
  background: var(--g700);
}

.final-screen {
  text-align: center;
  padding: 8px 0;
  animation: fadeIn 0.3s ease;
}

.final-icon {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--g100);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 14px;
}

.final-icon svg {
  width: 20px;
  height: 20px;
  color: var(--g600);
}

.final-title {
  font-size: 20px;
  font-weight: 700;
  color: var(--g800);
  margin: 0 0 8px 0;
}

.final-desc {
  font-size: 14px;
  color: var(--muted);
  margin: 0 auto 18px;
  line-height: 1.5;
  max-width: 460px;
}

.rules {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 20px;
  text-align: left;
}

.rule {
  padding: 12px 14px;
  border-radius: 8px;
  border-left: 4px solid var(--g600);
  background: var(--g50);
  font-size: 14px;
  line-height: 1.5;
}

.rule.stop {
  border-left-color: var(--o600);
  background: var(--o50);
}

.restart-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 24px;
  border: 2px solid var(--g600);
  border-radius: 8px;
  background: #fff;
  color: var(--g700);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}

.restart-btn:hover {
  background: var(--g50);
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 600px) {
  .wrap { padding: 16px; }
  .options { flex-direction: column; }
}
</style>
</head>
<body>

<div class="wrap" id="wrap">
  <h1 class="header-title">Выберите безопасный маршрут</h1>
  <p class="header-text">Прочитайте ситуацию и решите, что можно передать в публичный ИИ-сервис.</p>

  <div class="prog-bar" id="prog-bar">
    <span class="prog-label" id="prog-label">Вопрос 1 из 3</span>
    <div class="prog-track">
      <div class="prog-fill" id="prog-fill"></div>
    </div>
    <span class="prog-count" id="prog-count">1/3</span>
  </div>

  <div class="question-block" id="question-block">
    <div class="situation" id="situation"></div>
    <div class="question">Как поступить с документом?</div>
    <div class="options" id="options"></div>

    <div class="explanation" id="explanation">
      <div class="label" id="explanation-label"></div>
      <div id="explanation-text"></div>
    </div>

    <div class="comment" id="comment">
      <div class="label">Комментарий</div>
      <div id="comment-text"></div>
    </div>

    <button class="prompt-toggle-btn" id="prompt-toggle">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 2h8a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1Zm1 3h6M5 7.5h6M5 10h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Посмотреть пример промпта</span>
    </button>

    <div class="prompt-block" id="prompt-block">
      <div class="prompt-title" id="prompt-title"></div>
      <p class="prompt-note">Используйте шаблон только после проверки внутренних правил компании. Вставляйте в ИИ только обезличенные данные.</p>
      <div class="prompt-text" id="prompt-text"></div>
      <button class="copy-btn" id="copy-btn">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 10H13.5C14.0523 10 14.5 9.55228 14.5 9V2.5C14.5 1.94772 14.0523 1.5 13.5 1.5H7C6.44772 1.5 6 1.94772 6 2.5V6M2.5 14.5H9C9.55228 14.5 10 14.0523 10 13.5V7C10 6.44772 9.55228 6 9 6H2.5C1.94772 6 1.5 6.44772 1.5 7V13.5C1.5 14.0523 1.94772 14.5 2.5 14.5Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Скопировать промпт</span>
      </button>
    </div>

    <button class="next-btn" id="next-btn">Далее</button>
  </div>

  <div class="final-screen" id="final-screen" style="display: none;"></div>
</div>

<script>
function triggerResize() {
  if (window.iFrameResize) {
    window.iFrameResize({ log: false, checkOrigin: false }, '*');
  }
}

var options = [
  'Можно передать описание задачи',
  'Можно передать обезличенный фрагмент',
  'Стоп. Не загружайте документ'
];

var questions = [
  {
    situation: 'Нужно подготовить шаблон письма в цех. Эколог запрашивает сведения об образовании отходов за квартал.',
    correct: 0,
    explanation: 'Для шаблона достаточно цели письма и перечня данных, которые нужно запросить. ФИО адресатов, внутренние номера и реальные объемы отходов не нужны.',
    comment: 'Описание задачи - безопасный маршрут. ИИ подготовит шаблон, а реальные данные вы подставите сами.',
    promptTitle: 'Пример промпта: шаблон письма в цех',
    promptText: 'Вы - помощник промышленного эколога по подготовке внутренних деловых писем.\n\nПредприятие собирает сведения об образовании и передаче отходов за [период].\n\nПодготовьте черновик письма начальнику [подразделение]. Запросите сведения об образовании и передаче отходов.\n\nУкажите, что нужно предоставить:\n- наименование отхода;\n- код ФККО;\n- количество и единицу измерения;\n- место накопления;\n- дату передачи;\n- сведения о подтверждающих документах при наличии.\n\nОформите результат в официально-деловом стиле. Укажите тему письма и основной текст. Объем - до 1500 знаков.\n\nНе используйте ФИО, номера договоров, внутренние коды и реальные производственные показатели. Не придумывайте сроки, факты и реквизиты. Если информации недостаточно, сначала перечислите вопросы для уточнения.'
  },
  {
    situation: 'Нужно составить план внутреннего аудита обращения с отходами. Есть перечень подразделений, этапов и видов документов для проверки.',
    correct: 1,
    explanation: 'Для чернового плана достаточно этапов, предполагаемых ролей и видов документов. Не передавайте внутренние акты, журналы учета, договоры и результаты предыдущих проверок.',
    comment: 'Обезличенный фрагмент - безопасный маршрут. ИИ получит контекст, нужный для задачи, а внутренние документы останутся у вас.',
    promptTitle: 'Пример промпта: план внутреннего аудита',
    promptText: 'Вы - помощник промышленного эколога по планированию внутренних проверок.\n\nНужно подготовить черновой план внутреннего аудита обращения с отходами на промышленном предприятии.\n\nРазбейте аудит на этапы. Включите:\n- сбор и проверку документов;\n- проверку мест накопления отходов;\n- проверку маркировки и состояния тары;\n- сверку журналов учета;\n- проверку наличия договоров и подтверждающих документов;\n- фиксацию несоответствий;\n- подготовку корректирующих мероприятий.\n\nОформите результат в таблице с колонками: «Этап», «Действие», «Результат», «Предполагаемая роль исполнителя», «Что нужно уточнить».\n\nНе указывайте реальные названия подразделений, ФИО, номера договоров, координаты объектов и результаты предыдущих проверок. Не ссылайтесь на нормативные документы, если их текст не предоставлен. Не придумывайте сроки. Если данных недостаточно, сначала задайте уточняющие вопросы.'
  },
  {
    situation: 'Нужно проверить договор с подрядчиком по вывозу отходов. В документе есть реквизиты, цены, условия конфиденциальности и подписи сторон.',
    correct: 2,
    explanation: 'В договоре могут быть персональные данные, договорные условия и коммерчески чувствительные сведения. ИИ можно использовать иначе: попросить составить общий чек-лист условий, которые стоит проверить в договоре с подрядчиком.',
    comment: 'Стоп-сигнал - безопасный маршрут. Вместо договора передайте запрос на чек-лист и проверьте документ сами.',
    promptTitle: 'Пример промпта: чек-лист проверки договора с подрядчиком',
    promptText: 'Вы - помощник промышленного эколога по подготовке чек-листов.\n\nЭкологу нужно самостоятельно проверить договор с подрядчиком по вывозу отходов.\n\nСоставьте чек-лист условий, которые нужно проверить в договоре с подрядчиком по обращению с отходами.\n\nВключите вопросы по темам:\n- предмет договора;\n- виды отходов и коды ФККО;\n- лицензия подрядчика и разрешительные документы;\n- порядок передачи отходов;\n- сроки вывоза;\n- документы, подтверждающие передачу;\n- ответственность сторон;\n- срок действия договора;\n- порядок изменения и расторжения договора.\n\nОформите результат в таблице с колонками: «Что проверить», «Какие сведения найти в договоре», «Почему это важно экологу».\n\nНе приводите правовой вывод о конкретном договоре. Не придумывайте нормативные ссылки, реквизиты и условия, которых нет в исходных данных.'
  }
];

var rules = [
  { text: 'Если ИИ нужен только для шаблона, передайте описание задачи.', stop: false },
  { text: 'Если ему нужен контекст, передайте минимальный обезличенный фрагмент.', stop: false },
  { text: 'Если смысл задачи зависит от договора, технологии, координат, результатов измерений или внутренней позиции предприятия, не загружайте исходный документ в публичный сервис.', stop: true }
];

var currentQ = 0;
var score = 0;
var answered = false;

function renderQuestion() {
  answered = false;

  var q = questions[currentQ];

  document.getElementById('situation').textContent = q.situation;
  document.getElementById('prog-label').textContent = 'Вопрос ' + (currentQ + 1) + ' из 3';
  document.getElementById('prog-count').textContent = (currentQ + 1) + '/3';
  document.getElementById('prog-fill').style.width = (currentQ / 3 * 100) + '%';

  var optionsBox = document.getElementById('options');
  optionsBox.innerHTML = '';

  options.forEach(function(opt, idx) {
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = opt;
    btn.addEventListener('click', function() {
      answer(idx);
    });
    optionsBox.appendChild(btn);
  });

  document.getElementById('explanation').classList.remove('visible', 'wrong');
  document.getElementById('comment').classList.remove('visible');
  document.getElementById('prompt-toggle').classList.remove('visible');
  document.getElementById('prompt-block').classList.remove('open');
  document.getElementById('prompt-title').textContent = q.promptTitle;
  document.getElementById('prompt-text').textContent = q.promptText;

  var nextBtn = document.getElementById('next-btn');
  nextBtn.classList.remove('active');
  nextBtn.textContent = currentQ === questions.length - 1 ? 'Завершить' : 'Далее';

  var block = document.getElementById('question-block');
  block.style.animation = 'none';
  void block.offsetWidth;
  block.style.animation = '';

  triggerResize();
}

function answer(idx) {
  if (answered) return;
  answered = true;

  var q = questions[currentQ];
  var buttons = document.querySelectorAll('.opt-btn');

  buttons.forEach(function(btn, i) {
    if (i === q.correct) {
      btn.classList.add('selected-correct');
    } else if (i === idx) {
      btn.classList.add('selected-wrong');
    } else {
      btn.classList.add('disabled');
    }
  });

  if (idx === q.correct) {
    score++;
  }

  var explanation = document.getElementById('explanation');
  var label = document.getElementById('explanation-label');
  var text = document.getElementById('explanation-text');

  if (idx === q.correct) {
    label.textContent = 'Верно';
    text.textContent = q.explanation;
  } else {
    explanation.classList.add('wrong');
    label.textContent = 'Неверно';
    text.textContent = 'Безопасный маршрут - ' + options[q.correct].toLowerCase() + '. ' + q.explanation;
  }

  explanation.classList.add('visible');

  document.getElementById('comment-text').textContent = q.comment;
  document.getElementById('comment').classList.add('visible');

  document.getElementById('prompt-toggle').classList.add('visible');
  document.getElementById('next-btn').classList.add('active');

  triggerResize();
}

function showFinal() {
  document.getElementById('question-block').style.display = 'none';
  document.getElementById('prog-bar').style.display = 'none';

  var finalScreen = document.getElementById('final-screen');
  finalScreen.style.display = 'block';

  var desc = '';
  if (score === 3) {
    desc = 'Вы верно разобрали все три ситуации. Сохраните правила и примеры промптов - они пригодятся в работе.';
  } else if (score === 2) {
    desc = 'Вы справились с двумя ситуациями из трех. Перечитайте разборы и попробуйте еще раз.';
  } else {
    desc = 'Пока неуверенно. Вернитесь к уроку и попробуйте еще раз.';
  }

  var html = '';
  html += '<div class="final-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>';
  html += '<h2 class="final-title">Правило в работу</h2>';
  html += '<p class="final-desc">' + desc + '</p>';

  html += '<div class="rules">';
  rules.forEach(function(rule) {
    html += '<div class="rule' + (rule.stop ? ' stop' : '') + '">' + rule.text + '</div>';
  });
  html += '</div>';

  html += '<button class="restart-btn" id="restart-btn">Пройти еще раз</button>';

  finalScreen.innerHTML = html;

  document.getElementById('restart-btn').addEventListener('click', function() {
    restart();
  });

  triggerResize();
}

function restart() {
  currentQ = 0;
  score = 0;
  answered = false;

  document.getElementById('final-screen').style.display = 'none';
  document.getElementById('question-block').style.display = 'block';
  document.getElementById('prog-bar').style.display = 'flex';

  renderQuestion();
}

function copyToClipboard(text, btn) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(function() {
      showCopied(btn);
    }).catch(function() {
      fallbackCopy(text, btn);
    });
  } else {
    fallbackCopy(text, btn);
  }
}

function fallbackCopy(text, btn) {
  var textArea = document.createElement('textarea');
  textArea.value = text;
  textArea.style.position = 'fixed';
  textArea.style.top = '0';
  textArea.style.left = '0';
  textArea.style.width = '2em';
  textArea.style.height = '2em';
  textArea.style.padding = '0';
  textArea.style.border = 'none';
  textArea.style.outline = 'none';
  textArea.style.boxShadow = 'none';
  textArea.style.background = 'transparent';
  textArea.style.opacity = '0';
  document.body.appendChild(textArea);
  textArea.focus();
  textArea.select();
  try {
    document.execCommand('copy');
    showCopied(btn);
  } catch (err) {
    console.error('Copy failed', err);
  }
  document.body.removeChild(textArea);
}

function showCopied(btn) {
  btn.classList.add('copied');
  btn.querySelector('span').textContent = 'Скопировано';
  setTimeout(function() {
    btn.classList.remove('copied');
    btn.querySelector('span').textContent = 'Скопировать промпт';
  }, 2000);
  triggerResize();
}

document.getElementById('next-btn').addEventListener('click', function() {
  if (!answered) return;
  currentQ++;
  if (currentQ < questions.length) {
    renderQuestion();
  } else {
    showFinal();
  }
});

document.getElementById('prompt-toggle').addEventListener('click', function() {
  var block = document.getElementById('prompt-block');
  var isOpen = block.classList.contains('open');
  block.classList.toggle('open');
  this.querySelector('span').textContent = isOpen ? 'Посмотреть пример промпта' : 'Скрыть пример промпта';
  triggerResize();
});

document.getElementById('copy-btn').addEventListener('click', function() {
  copyToClipboard(questions[currentQ].promptText, this);
});

document.addEventListener('DOMContentLoaded', function() {
  renderQuestion();

  var wrap = document.getElementById('wrap');
  if (wrap) {
    new ResizeObserver(function() {
      triggerResize();
    }).observe(wrap);
  }
});
</script>

</body>
</html>
