<div id="scaffolding-widget" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; max-width: 760px; margin: 20px auto; box-sizing: border-box;">
  <style>
    #scaffolding-widget * {
      box-sizing: border-box;
    }
    .sw-steps-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    @media (max-width: 600px) {
      .sw-steps-grid {
        grid-template-columns: 1fr;
      }
    }
    .sw-step-btn {
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
      outline: none;
    }
    .sw-step-btn:hover {
      border-color: #94a3b8;
      background: #f8fafc;
    }
    .sw-step-btn.active {
      border-color: #16a34a;
      background: #f0fdf4;
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.08);
    }
    .sw-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #e2e8f0;
      color: #475569;
      font-weight: 700;
      font-size: 14px;
      transition: all 0.2s ease;
    }
    .sw-step-btn.active .sw-badge {
      background: #16a34a;
      color: #ffffff;
    }
    .sw-title {
      font-size: 16px;
      font-weight: 700;
      color: #1e293b;
      margin: 4px 0 0 0;
    }
    .sw-subtitle {
      font-size: 13px;
      color: #64748b;
    }
    .sw-hint-label {
      margin-top: 8px;
      font-size: 12px;
      font-weight: 600;
      color: #16a34a;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .sw-step-btn:not(.active) .sw-hint-label {
      color: #64748b;
    }
    .sw-content-box {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-left: 4px solid #16a34a;
      border-radius: 12px;
      padding: 20px 24px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
      animation: swFadeIn 0.25s ease;
    }
    @keyframes swFadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .sw-content-text {
      font-size: 15px;
      line-height: 1.55;
      color: #334155;
      margin: 0 0 12px 0;
    }
    .sw-result-tag {
      display: inline-block;
      background: #f1f5f9;
      color: #0f172a;
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 500;
    }
  </style>

  <div class="sw-steps-grid">
    <button type="button" class="sw-step-btn active" onclick="selectSwStep(0, this)">
      <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
        <span class="sw-badge">1</span>
        <span style="font-size: 18px;">👁️</span>
      </div>
      <div class="sw-title">Посмотри</div>
      <div class="sw-subtitle">Разбор примера</div>
      <div class="sw-hint-label">Открыто • Подсказка</div>
    </button>

    <button type="button" class="sw-step-btn" onclick="selectSwStep(1, this)">
      <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
        <span class="sw-badge">2</span>
        <span style="font-size: 18px;">⚙️</span>
      </div>
      <div class="sw-title">Повтори</div>
      <div class="sw-subtitle">Действие в тренажере</div>
      <div class="sw-hint-label">Нажмите для подсказки →</div>
    </button>

    <button type="button" class="sw-step-btn" onclick="selectSwStep(2, this)">
      <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
        <span class="sw-badge">3</span>
        <span style="font-size: 18px;">🏭</span>
      </div>
      <div class="sw-title">Примени</div>
      <div class="sw-subtitle">Перенос в работу</div>
      <div class="sw-hint-label">Нажмите для подсказки →</div>
    </button>
  </div>

  <div id="sw-display" class="sw-content-box">
    <p class="sw-content-text" id="sw-text">
      Сначала вы изучаете готовый кейс из практики предприятия — видите правильный запрос и качественный результат.
    </p>
    <div class="sw-result-tag" id="sw-tag">
      Что делаете: анализируете структуру промпта и логику диалога с ИИ
    </div>
  </div>

  <script>
    const swData = [
      {
        text: "Сначала вы изучаете готовый кейс из практики предприятия — видите правильный запрос и качественный результат.",
        tag: "Что делаете: анализируете структуру промпта и логику диалога с ИИ"
      },
      {
        text: "Затем воспроизводите алгоритм в безопасном тренажере с подсказками, где нельзя ничего сломать.",
        tag: "Что делаете: собираете запрос по шаблону и сверяете ответ с образцом"
      },
      {
        text: "В финале переносите прием на свою реальную задачу и уносите готовый документ для своего завода.",
        tag: "Что делаете: адаптируете шаблон под свое предприятие и получаете готовый черновик"
      }
    ];

    function selectSwStep(index, btnElement) {
      const buttons = document.querySelectorAll('#scaffolding-widget .sw-step-btn');
      buttons.forEach((btn) => {
        btn.classList.remove('active');
        btn.querySelector('.sw-hint-label').textContent = 'Нажмите для подсказки →';
      });

      btnElement.classList.add('active');
      btnElement.querySelector('.sw-hint-label').textContent = 'Открыто • Подсказка';

      const display = document.getElementById('sw-display');
      const textEl = document.getElementById('sw-text');
      const tagEl = document.getElementById('sw-tag');

      display.style.animation = 'none';
      display.offsetHeight; 
      display.style.animation = null;

      textEl.textContent = swData[index].text;
      tagEl.textContent = swData[index].tag;
    }
  </script>
</div>
