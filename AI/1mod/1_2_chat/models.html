<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/iframe-resizer/4.3.6/iframeResizer.contentWindow.min.js"></script>
<style>
:root {
  --bg: #f5f7fa;
  --card: #ffffff;
  --g50: #f0fdf4;
  --g100: #dcfce7;
  --g600: #16a34a;
  --g700: #15803d;
  --g800: #166534;
  --o50: #fff7ed;
  --o100: #ffedd5;
  --o600: #ea580c;
  --o800: #9a3412;
  --text: #1e293b;
  --muted: #64748b;
  --border: #e2e8f0;
  --radius: 12px;
  --shadow: 0 4px 12px rgba(0,0,0,0.05);
  --chat-bg: #f8fafc;
  --msg-alex: #ffffff;
  --msg-mentor: #f0fdf4;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 16px;
  background: var(--bg);
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
}

.wrap {
  max-width: 650px;
  margin: 0 auto;
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  overflow: hidden;
}

.chat-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 20px;
  background: #fff;
  border-bottom: 1px solid var(--border);
}

.avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, #3b82f6, #1d4ed8);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-weight: 700;
  font-size: 15px;
  flex-shrink: 0;
  overflow: hidden;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.contact-info {
  flex: 1;
}

.contact-name {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
}

.contact-status {
  font-size: 12px;
  color: var(--g600);
  display: flex;
  align-items: center;
  gap: 4px;
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--g600);
}

.chat-body {
  padding: 20px;
  background: var(--chat-bg);
  min-height: 400px;
}

.message {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
  animation: fadeIn 0.3s ease;
}

.message.mentor {
  flex-direction: row-reverse;
}

.msg-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, #3b82f6, #1d4ed8);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-weight: 700;
  font-size: 12px;
  flex-shrink: 0;
  overflow: hidden;
}

.msg-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.message.mentor .msg-avatar {
  background: linear-gradient(135deg, var(--g600), var(--g700));
}

.msg-bubble {
  max-width: 80%;
  padding: 10px 14px;
  border-radius: 14px;
  font-size: 14px;
  line-height: 1.5;
  position: relative;
}

.message:not(.mentor) .msg-bubble {
  background: var(--msg-alex);
  border: 1px solid var(--border);
  border-bottom-left-radius: 4px;
}

.message.mentor .msg-bubble {
  background: var(--msg-mentor);
  border: 1px solid var(--g100);
  border-bottom-right-radius: 4px;
}

.msg-time {
  font-size: 11px;
  color: var(--muted);
  margin-top: 4px;
}

.task-block {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  margin: 16px 0;
  animation: fadeIn 0.3s ease;
}

.task-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  color: var(--g700);
  margin-bottom: 8px;
}

.task-label svg {
  width: 14px;
  height: 14px;
}

.task-text {
  font-size: 14px;
  color: var(--text);
  margin-bottom: 14px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.opt-btn {
  width: 100%;
  padding: 12px 14px;
  border: 2px solid var(--border);
  border-radius: 10px;
  background: #fff;
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  cursor: pointer;
  text-align: left;
  transition: all 0.2s;
  line-height: 1.4;
}

.opt-btn:hover:not(.disabled) {
  border-color: var(--g600);
  background: var(--g50);
}

.opt-btn.selected-correct {
  border-color: var(--g600);
  background: var(--g100);
  color: var(--g800);
  cursor: default;
}

.opt-btn.selected-wrong {
  border-color: var(--o600);
  background: var(--o100);
  color: var(--o800);
  cursor: default;
}

.opt-btn.disabled {
  opacity: 0.5;
  pointer-events: none;
}

.feedback {
  padding: 14px;
  border-radius: 10px;
  border-left: 4px solid var(--g600);
  background: var(--g50);
  font-size: 14px;
  line-height: 1.5;
  margin: 16px 0;
  animation: fadeIn 0.3s ease;
}

.feedback.wrong {
  border-left-color: var(--o600);
  background: var(--o50);
}

.feedback-label {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  margin-bottom: 6px;
  color: var(--g700);
}

.feedback.wrong .feedback-label {
  color: var(--o800);
}

.feedback-hint {
  margin-top: 8px;
  font-size: 13px;
  color: var(--muted);
  font-style: italic;
}

.rkzf-block {
  margin-top: 10px;
  padding: 10px;
  background: rgba(255,255,255,0.6);
  border-radius: 8px;
}

.rkzf-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 6px;
  font-size: 13px;
}

.rkzf-item:last-child {
  margin-bottom: 0;
}

.rkzf-icon {
  width: 20px;
  height: 20px;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
}

.rkzf-r { background: #3b82f6; }
.rkzf-k { background: #8b5cf6; }
.rkzf-z { background: #f59e0b; }
.rkzf-f { background: #10b981; }

.btn-row {
  display: flex;
  gap: 10px;
  margin-top: 16px;
  flex-wrap: wrap;
}

.btn {
  padding: 10px 20px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  border: none;
}

.btn-primary {
  background: var(--g600);
  color: #fff;
}

.btn-primary:hover {
  background: var(--g700);
}

.btn-secondary {
  background: #fff;
  color: var(--g700);
  border: 2px solid var(--g600);
}

.btn-secondary:hover {
  background: var(--g50);
}

.btn-ghost {
  background: transparent;
  color: var(--muted);
  border: 1px solid var(--border);
}

.btn-ghost:hover {
  background: #f1f5f9;
}

.progress-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 20px;
  background: #fff;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  color: var(--muted);
}

.progress-track {
  flex: 1;
  height: 4px;
  background: #e2e8f0;
  border-radius: 2px;
  margin: 0 12px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--g600);
  border-radius: 2px;
  transition: width 0.4s;
}

.final-screen {
  text-align: center;
  padding: 30px 20px;
  animation: fadeIn 0.3s ease;
}

.final-icon {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--g100);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 16px;
}

.final-icon svg {
  width: 28px;
  height: 28px;
  color: var(--g600);
}

.final-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--g800);
  margin-bottom: 8px;
}

.final-desc {
  font-size: 14px;
  color: var(--muted);
  margin-bottom: 20px;
  max-width: 400px;
  margin-left: auto;
  margin-right: auto;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 600px) {
  body { padding: 8px; }
  .chat-body { padding: 14px; }
  .msg-bubble { max-width: 85%; font-size: 13px; }
  .task-block { padding: 12px; }
  .btn-row { flex-direction: column; }
  .btn { width: 100%; text-align: center; }
}

.hidden {
  display: none;
}
</style>
</head>
<body>

<div class="wrap" id="wrap">
  <div class="chat-header">
    <div class="avatar">
      <img src="oleg.jpg" alt="Алексей" onerror="this.style.display='none';this.parentNode.innerHTML='А';">
    </div>
    <div class="contact-info">
      <div class="contact-name">Алексей, эколог</div>

    <span id="progress-count">1/3</span>

  <div class="chat-body" id="chat-body"></div>
</div>

      { id: 'c', text: '«Ты руководитель экологической службы на промышленном предприятии второй категории. Напиши служебную записку генеральному директору. Обоснуй необходимость закупки газоанализатора для мониторинга выбросов. Текущая ситуация: лабораторные замеры раз в квартал, этого недостаточно для контроля. Укажи три конкретных выгоды для бизнеса: снижение штрафов, выполнение требований ПЭК, улучшение отношений с Росприроднадзором. Объем: до 200 слов. Тон: официально-деловой. Формат: шапка, вступление, три тезиса с цифрами, призыв к действию, подпись.»', correct: true }
    ],
    promptFeedbackCorrect: 'Отличный выбор! Разбор по формуле РКЗФ:',
    promptFeedbackWrong: {
      'a': 'Слишком короткий промпт. Нет роли, контекста, формата. Нейросеть выдаст общий текст про экологию без конкретики.',
      'b': 'Уже лучше, есть контекст. Но нет роли (кто пишет), нет формата (объем, стиль, структура). Результат будет приблизительным.'
    },
    promptRkzf: [
      { letter: 'Р', label: 'Роль', text: 'руководитель экологической службы', color: 'rkzf-r' },
      { letter: 'К', label: 'Контекст', text: 'предприятие второй категории, проблема с частотой замеров', color: 'rkzf-k' },
      { letter: 'З', label: 'Задача', text: 'обосновать закупку газоанализатора', color: 'rkzf-z' },
      { letter: 'Ф', label: 'Формат', text: 'официально-деловой стиль, 200 слов, структура с шапкой и тремя тезисами', color: 'rkzf-f' }
    ],
    alexFinal: 'Спасибо! Теперь понял, почему раньше получалась ерунда. Буду использовать эту формулу.'
  }
];

var currentCase = 0;
var currentStep = 'alex';
var selectedOption = null;
var selectedWrongOptions = [];
var currentFeedbackText = '';
var currentFeedbackType = '';
var skippedPrompt = false;

function render() {
  var chatBody = document.getElementById('chat-body');
  var caseData = cases[currentCase];
  var html = '';

  document.getElementById('progress-label').textContent = 'Кейс ' + (currentCase + 1) + ' из 3';
  document.getElementById('progress-count').textContent = (currentCase + 1) + '/3';
  document.getElementById('progress-fill').style.width = ((currentCase + 1) / 3 * 100) + '%';

  if (currentStep === 'alex') {
    html += renderAlexMessage(caseData.alexMsg);
    html += '<div class="task-block">';
    html += '<div class="task-label"><svg viewBox="0 0 16 16" fill="none"><path d="M8 1v14M1 8h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg> Задание</div>';
    html += '<div class="task-text">' + caseData.taskText + '</div>';
    html += '<div class="options">';
    caseData.options.forEach(function(opt, idx) {
      html += '<button class="opt-btn" data-idx="' + idx + '" data-id="' + opt.id + '">' + opt.text + '</button>';
    });
    html += '</div></div>';

  } else if (currentStep === 'feedback-wrong') {
    html += renderAlexMessage(caseData.alexMsg);

    html += '<div class="task-block">';
    html += '<div class="options">';
    caseData.options.forEach(function(opt, idx) {
      var cls = 'opt-btn';
      if (selectedWrongOptions.indexOf(idx) !== -1) {
        cls += ' selected-wrong disabled';
      }
      html += '<button class="' + cls + '" data-idx="' + idx + '">' + opt.text + '</button>';
    });
    html += '</div>';
    html += '</div>';

    html += '<div class="feedback wrong">';
    html += '<div class="feedback-label">Не совсем</div>';
    html += '<div>' + currentFeedbackText + '</div>';
    html += '<div class="feedback-hint">Попробуйте выбрать другой вариант.</div>';
    html += '</div>';

  } else if (currentStep === 'feedback') {
    html += renderAlexMessage(caseData.alexMsg);

    html += '<div class="task-block">';
    html += '<div class="options">';
    caseData.options.forEach(function(opt, idx) {
      var cls = 'opt-btn disabled';
      if (idx === selectedOption) {
        cls += ' selected-correct';
      } else if (selectedWrongOptions.indexOf(idx) !== -1) {
        cls += ' selected-wrong';
      }
      html += '<button class="' + cls + '">' + opt.text + '</button>';
    });
    html += '</div></div>';

    html += '<div class="feedback">';
    html += '<div class="feedback-label">Верно</div>';
    html += '<div>' + currentFeedbackText + '</div>';
    html += '</div>';

    html += '<div class="btn-row">';
    html += '<button class="btn btn-primary" id="btn-next">Далее</button>';
    html += '</div>';

  } else if (currentStep === 'promptOffer') {
    html += renderAlexMessage(caseData.alexMsg);

    html += '<div class="message mentor">';
    html += '<div class="msg-avatar">Н</div>';
    html += '<div>';
    html += '<div class="msg-bubble">Отлично, модель вы подобрали. Хотите помочь Алексею составить промпт? Это займет пару минут и закрепит навык. Если нет времени - просто нажмите "Пропустить".</div>';
    html += '</div></div>';

    html += '<div class="btn-row">';
    html += '<button class="btn btn-primary" id="btn-help">Да, помогу составить промпт</button>';
    html += '<button class="btn btn-ghost" id="btn-skip">Пропустить</button>';
    html += '</div>';

  } else if (currentStep === 'promptTask') {
    html += renderAlexMessage(caseData.alexMsg);

    html += '<div class="task-block">';
    html += '<div class="task-label"><svg viewBox="0 0 16 16" fill="none"><path d="M8 1v14M1 8h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg> Задание</div>';
    html += '<div class="task-text">' + caseData.promptTask + '</div>';
    html += '<div class="options">';
    caseData.promptOptions.forEach(function(opt, idx) {
      var cls = 'opt-btn';
      if (selectedWrongOptions.indexOf(idx) !== -1) {
        cls += ' selected-wrong disabled';
      }
      html += '<button class="' + cls + '" data-pidx="' + idx + '">' + opt.text + '</button>';
    });
    html += '</div>';

    if (currentFeedbackText) {
      html += '<div class="feedback wrong" style="margin-top:14px;">';
      html += '<div class="feedback-label">Не совсем</div>';
      html += '<div>' + currentFeedbackText + '</div>';
      html += '<div class="feedback-hint">Попробуйте выбрать другой вариант.</div>';
      html += '</div>';
    }

    html += '</div>';

  } else if (currentStep === 'promptFeedback') {
    html += renderAlexMessage(caseData.alexMsg);

    html += '<div class="task-block">';
    html += '<div class="options">';
    caseData.promptOptions.forEach(function(opt, idx) {
      var cls = 'opt-btn disabled';
      if (idx === selectedOption) {
        cls += ' selected-correct';
      } else if (selectedWrongOptions.indexOf(idx) !== -1) {
        cls += ' selected-wrong';
      }
      html += '<button class="' + cls + '">' + opt.text + '</button>';
    });
    html += '</div></div>';

    html += '<div class="feedback">';
    html += '<div class="feedback-label">Верно</div>';
    html += '<div>' + currentFeedbackText + '</div>';

    if (caseData.promptRkzf) {
      html += '<div class="rkzf-block">';
      caseData.promptRkzf.forEach(function(item) {
        html += '<div class="rkzf-item">';
        html += '<div class="rkzf-icon ' + item.color + '">' + item.letter + '</div>';
        html += '<div><strong>' + item.label + ':</strong> ' + item.text + '</div>';
        html += '</div>';
      });
      html += '</div>';
      html += '<div style="margin-top:10px;font-size:13px;">Алексей получит готовый результат. Ему останется только проверить данные по первоисточнику.</div>';
    }
    html += '</div>';

    html += '<div class="btn-row">';
    html += '<button class="btn btn-primary" id="btn-next">Далее</button>';
    html += '</div>';

  } else if (currentStep === 'final') {
    html += renderAlexMessage(caseData.alexFinal);

    html += '<div class="message mentor">';
    html += '<div class="msg-avatar">Н</div>';
    html += '<div>';
    html += '<div class="msg-bubble">Вы помогли коллеге решить проблему.</div>';
    html += '</div></div>';

    if (currentCase < 2) {
      html += '<div class="btn-row">';
      html += '<button class="btn btn-primary" id="btn-next-case">Перейти к следующему кейсу</button>';
      html += '</div>';
    } else {
      html += '<div class="final-screen">';
      html += '<div class="final-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>';
      html += '<div class="final-title">Тренажер завершен</div>';
      html += '<div class="final-desc">Вы помогли Алексею подобрать модели и составить промпты по формуле РКЗФ. Теперь вы умеете выбирать подходящий ИИ-инструмент и формулировать задачи для нейросети.</div>';
      html += '<button class="btn btn-primary" id="btn-finish">Вернуться к уроку</button>';
      html += '</div>';
    }
  }

  chatBody.innerHTML = html;
  bindEvents();
  triggerResize();
}

function renderAlexMessage(text) {
  var html = '<div class="message">';
  html += '<div class="msg-avatar"><img src="oleg.jpg" alt="А" onerror="this.style.display=\'none\';this.parentNode.innerHTML=\'А\';"></div>';
  html += '<div>';
  html += '<div class="msg-bubble">' + text + '</div>';
  html += '<div class="msg-time">сегодня, ' + getRandomTime() + '</div>';
  html += '</div></div>';
  return html;
}

function bindEvents() {
  var optBtns = document.querySelectorAll('.opt-btn[data-idx]');
  optBtns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      var idx = parseInt(btn.getAttribute('data-idx'));
      var caseData = cases[currentCase];
      var opt = caseData.options[idx];

      if (opt.correct) {
        selectedOption = idx;
        currentFeedbackText = caseData.feedbackCorrect;
        currentFeedbackType = 'correct';
        currentStep = 'feedback';
      } else {
        if (selectedWrongOptions.indexOf(idx) === -1) {
          selectedWrongOptions.push(idx);
        }
        currentFeedbackText = caseData.feedbackWrong[opt.id];
        currentFeedbackType = 'wrong';
        currentStep = 'feedback-wrong';
      }
      render();
    });
  });

  var promptBtns = document.querySelectorAll('.opt-btn[data-pidx]');
  promptBtns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      var idx = parseInt(btn.getAttribute('data-pidx'));
      var caseData = cases[currentCase];
      var opt = caseData.promptOptions[idx];

      if (opt.correct) {
        selectedOption = idx;
        currentFeedbackText = caseData.promptFeedbackCorrect;
        currentFeedbackType = 'correct';
        currentStep = 'promptFeedback';
      } else {
        if (selectedWrongOptions.indexOf(idx) === -1) {
          selectedWrongOptions.push(idx);
        }
        currentFeedbackText = caseData.promptFeedbackWrong[opt.id];
        currentFeedbackType = 'wrong';
        currentStep = 'promptTask';
      }
      render();
    });
  });

  var btnNext = document.getElementById('btn-next');
  if (btnNext) {
    btnNext.addEventListener('click', function() {
      if (currentStep === 'feedback') {
        currentStep = 'promptOffer';
      } else if (currentStep === 'promptFeedback') {
        currentStep = 'final';
      }
      selectedOption = null;
      selectedWrongOptions = [];
      currentFeedbackText = '';
      render();
    });
  }

  var btnHelp = document.getElementById('btn-help');
  if (btnHelp) {
    btnHelp.addEventListener('click', function() {
      currentStep = 'promptTask';
      selectedOption = null;
      selectedWrongOptions = [];
      currentFeedbackText = '';
      render();
    });
  }

  var btnSkip = document.getElementById('btn-skip');
  if (btnSkip) {
    btnSkip.addEventListener('click', function() {
      skippedPrompt = true;
      currentStep = 'final';
      selectedOption = null;
      selectedWrongOptions = [];
      currentFeedbackText = '';
      render();
    });
  }

  var btnNextCase = document.getElementById('btn-next-case');
  if (btnNextCase) {
    btnNextCase.addEventListener('click', function() {
      currentCase++;
      currentStep = 'alex';
      selectedOption = null;
      selectedWrongOptions = [];
      currentFeedbackText = '';
      skippedPrompt = false;
      render();
    });
  }

  var btnFinish = document.getElementById('btn-finish');
  if (btnFinish) {
    btnFinish.addEventListener('click', function() {
      currentCase = 0;
      currentStep = 'alex';
      selectedOption = null;
      selectedWrongOptions = [];
      currentFeedbackText = '';
      render();
    });
  }
}

function getRandomTime() {
  var hours = Math.floor(Math.random() * 8) + 9;
  var mins = Math.floor(Math.random() * 60);
  return (hours < 10 ? '0' : '') + hours + ':' + (mins < 10 ? '0' : '') + mins;
}

document.addEventListener('DOMContentLoaded', function() {
  render();

  var wrap = document.getElementById('wrap');
  if (wrap && window.ResizeObserver) {
    new ResizeObserver(function() {
      triggerResize();
    }).observe(wrap);
  }
});
</script>

</body>
</html>
