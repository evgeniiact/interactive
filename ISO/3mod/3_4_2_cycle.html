<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/iframe-resizer/4.3.6/iframeResizer.contentWindow.min.js"></script>
<title>Жизненный цикл документации СЭМ</title>
<style>
  :root {
    --primary: #1e293b;
    --muted: #64748b;
    --border: #cbd5e1;
    --bg: #ffffff;
    --gray: #f8fafc;
    --r: 10px;
    --c1: #1e40af;
    --c1-bg: #eff6ff;
    --c2: #0e7490;
    --c2-bg: #ecfeff;
    --c3: #4338ca;
    --c3-bg: #eef2ff;
    --c4: #7c3aed;
    --c4-bg: #f5f3ff;
    --c5: #047857;
    --c5-bg: #ecfdf5;
    --c6: #b45309;
    --c6-bg: #fffbeb;
  }

  body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    color: var(--primary);
    background: var(--bg);
    margin: 0;
    padding: 14px;
  }

  .container {
    max-width: 650px;
    margin: 0 auto;
  }

  .hint {
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 14px;
  }

  .cycle {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 14px;
  }

  .row {
    display: flex;
    align-items: stretch;
    gap: 6px;
  }

  .stage {
    flex: 1;
    border: 2px solid var(--border);
    border-radius: 8px;
    background: #fff;
    padding: 12px 10px;
    cursor: pointer;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    transition: all 0.2s ease;
    min-height: 74px;
  }

  .stage:hover {
    transform: translateY(-2px);
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
  }

  .stage-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--gray);
    border: 1px solid var(--border);
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    margin: 0 auto;
  }

  .stage-title {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.35;
    color: var(--primary);
  }

  .arrow {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    width: 30px;
    color: var(--muted);
  }

  .arrow svg {
    width: 26px;
    height: 20px;
  }

  /* Активные состояния */
  .stage.active-1 { border-color: var(--c1); background: var(--c1-bg); }
  .stage.active-2 { border-color: var(--c2); background: var(--c2-bg); }
  .stage.active-3 { border-color: var(--c3); background: var(--c3-bg); }
  .stage.active-4 { border-color: var(--c4); background: var(--c4-bg); }
  .stage.active-5 { border-color: var(--c5); background: var(--c5-bg); }
  .stage.active-6 { border-color: var(--c6); background: var(--c6-bg); }

  .stage.active-1 .stage-num { background: var(--c1); color: #fff; border-color: var(--c1); }
  .stage.active-2 .stage-num { background: var(--c2); color: #fff; border-color: var(--c2); }
  .stage.active-3 .stage-num { background: var(--c3); color: #fff; border-color: var(--c3); }
  .stage.active-4 .stage-num { background: var(--c4); color: #fff; border-color: var(--c4); }
  .stage.active-5 .stage-num { background: var(--c5); color: #fff; border-color: var(--c5); }
  .stage.active-6 .stage-num { background: var(--c6); color: #fff; border-color: var(--c6); }

  .stage.active-1 .stage-title { color: var(--c1); }
  .stage.active-2 .stage-title { color: var(--c2); }
  .stage.active-3 .stage-title { color: var(--c3); }
  .stage.active-4 .stage-title { color: var(--c4); }
  .stage.active-5 .stage-title { color: var(--c5); }
  .stage.active-6 .stage-title { color: var(--c6); }

  /* Карточка описания */
  .description {
    border-radius: var(--r);
    border-left: 4px solid var(--muted);
    background: var(--gray);
    padding: 14px 16px;
    font-size: 13px;
    line-height: 1.55;
    display: none;
    animation: fadeIn 0.25s ease;
  }

  .description.show { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-5px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .description.d-1 { border-left-color: var(--c1); background: var(--c1-bg); }
  .description.d-2 { border-left-color: var(--c2); background: var(--c2-bg); }
  .description.d-3 { border-left-color: var(--c3); background: var(--c3-bg); }
  .description.d-4 { border-left-color: var(--c4); background: var(--c4-bg); }
  .description.d-5 { border-left-color: var(--c5); background: var(--c5-bg); }
  .description.d-6 { border-left-color: var(--c6); background: var(--c6-bg); }

  .desc-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }

  .desc-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .d-1 .desc-num { background: var(--c1); }
  .d-2 .desc-num { background: var(--c2); }
  .d-3 .desc-num { background: var(--c3); }
  .d-4 .desc-num { background: var(--c4); }
  .d-5 .desc-num { background: var(--c5); }
  .d-6 .desc-num { background: var(--c6); }

  .desc-title {
    font-weight: 700;
    font-size: 14px;
  }

  .d-1 .desc-title { color: var(--c1); }
  .d-2 .desc-title { color: var(--c2); }
  .d-3 .desc-title { color: var(--c3); }
  .d-4 .desc-title { color: var(--c4); }
  .d-5 .desc-title { color: var(--c5); }
  .d-6 .desc-title { color: var(--c6); }

  .desc-text {
    margin: 0 0 8px 0;
    color: var(--primary);
  }

  .desc-example {
    padding-top: 8px;
    border-top: 1px dashed var(--border);
    font-size: 12px;
    color: var(--muted);
  }

  .desc-example strong {
    color: var(--primary);
    font-weight: 600;
  }

  @media (max-width: 640px) {
    body { padding: 10px; }
    .row { flex-direction: column; gap: 6px; }
    .stage { min-height: 56px; padding: 10px; }
    .stage-title { font-size: 12px; }
    .arrow { width: 100%; height: 22px; }
    .arrow svg { transform: rotate(90deg); }
  }
</style>
</head>
<body>

<div class="container">
  <div class="hint">Нажмите на этап, чтобы увидеть, что происходит с документом</div>

  <div class="cycle">
    <div class="row">
      <div class="stage" data-stage="1" onclick="showStage(1)">
        <span class="stage-num">1</span>
        <span class="stage-title">Создание и оформление</span>
      </div>
      <div class="arrow">
        <svg viewBox="0 0 26 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="10" x2="20" y2="10"/><polyline points="14 4 21 10 14 16"/></svg>
      </div>
      <div class="stage" data-stage="2" onclick="showStage(2)">
        <span class="stage-num">2</span>
        <span class="stage-title">Согласование и утверждение</span>
      </div>
      <div class="arrow">
        <svg viewBox="0 0 26 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="10" x2="20" y2="10"/><polyline points="14 4 21 10 14 16"/></svg>
      </div>
      <div class="stage" data-stage="3" onclick="showStage(3)">
        <span class="stage-num">3</span>
        <span class="stage-title">Публикация</span>
      </div>
    </div>

    <div class="row">
      <div class="stage" data-stage="4" onclick="showStage(4)">
        <span class="stage-num">4</span>
        <span class="stage-title">Внедрение</span>
      </div>
      <div class="arrow">
        <svg viewBox="0 0 26 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="10" x2="20" y2="10"/><polyline points="14 4 21 10 14 16"/></svg>
      </div>
      <div class="stage" data-stage="5" onclick="showStage(5)">
        <span class="stage-num">5</span>
        <span class="stage-title">Актуализация и архивирование</span>
      </div>
      <div class="arrow">
        <svg viewBox="0 0 26 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="10" x2="20" y2="10"/><polyline points="14 4 21 10 14 16"/></svg>
      </div>
      <div class="stage" data-stage="6" onclick="showStage(6)">
        <span class="stage-num">6</span>
        <span class="stage-title">Изъятие, уничтожение</span>
      </div>
    </div>
  </div>

  <div class="description" id="description">
    <div class="desc-header">
      <span class="desc-num" id="descNum">1</span>
      <span class="desc-title" id="descTitle"></span>
    </div>
    <p class="desc-text" id="descText"></p>
    <div class="desc-example" id="descExample"></div>
  </div>
</div>

<script>
  const stages = {
    1: {
      title: 'Создание и оформление',
      text: 'Разрабатывают документ и присваивают ему признаки идентификации: код, версию, дату. На этом этапе определяют, кто автор и для каких процессов нужен документ.',
      example: 'Пример: эколог готовит проект инструкции по обращению со стеклобоем и присваивает ей код ИО-ООС-07, версия 1.0.'
    },
    2: {
      title: 'Согласование и утверждение',
      text: 'Документ согласуют с подразделениями, которых он касается, и утверждает у уполномоченного лица. Согласование фиксирует, что требования реалистичны и не противоречат другим документам.',
      example: 'Пример: инструкцию согласуют начальник цеха шихты и главный инженер, утверждает директор приказом.'
    },
    3: {
      title: 'Публикация',
      text: 'Актуальную версию размещают в системе документооборота или на стендах и доводят до тех, кто будет работать по документу. Устаревшие копии помечают для отзыва.',
      example: 'Пример: инструкция загружена в общую папку СЭМ с пометкой «действует», копия распечатана на стенде участка.'
    },
    4: {
      title: 'Внедрение',
      text: 'Персонал обучают и применяют документ в работе. Здесь проверяют, что требования понятны и выполняются, а не остались на бумаге.',
      example: 'Пример: мастера проводят инструктаж по новой инструкции, рабочие начинают сортировать бой по новым контейнерам.'
    },
    5: {
      title: 'Актуализация и архивирование',
      text: 'Документ периодически пересматривают: меняют версию при изменении закона, технологии или аспектов. Прежние версии отправляют в архив с сохранением доступа для доказательств.',
      example: 'Пример: после изменения норматива по выбросам инструкцию пересматривают до версии 2.0, версия 1.0 уходит в архив.'
    },
    6: {
      title: 'Изъятие, уничтожение',
      text: 'Недействительные документы изымают из мест применения, чтобы по ним не работали. Уничтожают или хранят по регламенту, фиксируя это актом. Сохраняют одну эталонную копию.',
      example: 'Пример: изъятые распечатки версии 1.0 уничтожают, составляют акт, в архиве остается подписанный эталон.'
    }
  };

  function showStage(num) {
    const data = stages[num];
    if (!data) return;

    document.querySelectorAll('.stage').forEach(s => {
      s.className = 'stage';
    });
    document.querySelector(`.stage[data-stage="${num}"]`).classList.add('active-' + num);

    const desc = document.getElementById('description');
    desc.className = 'description show d-' + num;
    document.getElementById('descNum').textContent = num;
    document.getElementById('descTitle').textContent = data.title;
    document.getElementById('descText').textContent = data.text;

    const parts = data.example.split(':');
    document.getElementById('descExample').innerHTML = '<strong>' + parts[0] + ':</strong>' + parts.slice(1).join(':');

    resizeIframe();
  }

  function resizeIframe() {
    if (window.parentIFrame && typeof window.parentIFrame.size === 'function') {
      window.parentIFrame.size();
    }
  }

  window.addEventListener('load', () => {
    showStage(1);
    resizeIframe();
  });

  if ('ResizeObserver' in window) {
    const container = document.querySelector('.container');
    if (container) {
      let t;
      new ResizeObserver(() => {
        clearTimeout(t);
        t = setTimeout(resizeIframe, 100);
      }).observe(container);
    }
  }
</script>

</body>
</html>
