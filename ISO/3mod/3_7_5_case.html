<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/iframe-resizer/4.3.6/iframeResizer.contentWindow.min.js"></script>
<title>Тренажер: найдите слабое место в договоре</title>
<style>
  :root {
    --primary: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
    --bg: #ffffff;
    --gray: #f8fafc;
    --accent: #2563eb;
    --accent-d: #1d4ed8;
    --ok: #166534;
    --ok-bg: #f0fdf4;
    --ok-bd: #bbf7d0;
    --bad: #991b1b;
    --bad-bg: #fef2f2;
    --bad-bd: #fecaca;
    --r: 10px;
  }

  * { box-sizing: border-box; }
  html, body { overflow: hidden; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    color: var(--primary);
    background: var(--bg);
    padding: 14px 12px;
  }

  .container { max-width: 650px; margin: 0 auto; }

  .task-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }

  .task-chip {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #fff;
    background: var(--accent);
    border-radius: 999px;
    padding: 2px 10px;
    flex-shrink: 0;
  }

  .task-title {
    font-size: 15px;
    font-weight: 700;
  }

  .task-text {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 12px 0;
    line-height: 1.5;
  }

  .options { display: flex; flex-direction: column; gap: 8px; }

  .option {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    width: 100%;
    text-align: left;
    border: 1px solid var(--border);
    border-radius: var(--r);
    background: #fff;
    padding: 11px 12px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    line-height: 1.5;
    color: var(--primary);
    transition: all 0.15s ease;
  }

  .option:hover:not(:disabled) {
    border-color: var(--accent);
    background: var(--gray);
    transform: translateY(-1px);
  }

  .option:disabled { cursor: default; }

  .option-num {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--gray);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
    transition: all 0.15s ease;
  }

  .option.wrong {
    border-color: var(--bad-bd);
    background: var(--bad-bg);
    color: var(--bad);
    opacity: 0.75;
  }

  .option.wrong .option-num { background: var(--bad); border-color: var(--bad); color: #fff; }
  .option.wrong .option-num::after { content: '✕'; font-size: 10px; }
  .option.wrong .option-num span { display: none; }

  .option.correct {
    border-color: var(--ok-bd);
    background: var(--ok-bg);
    color: var(--ok);
  }

  .option.correct .option-num { background: var(--ok); border-color: var(--ok); color: #fff; }
  .option.correct .option-num::after { content: '✓'; font-size: 11px; }
  .option.correct .option-num span { display: none; }

  .feedback {
    display: none;
    border-radius: var(--r);
    padding: 10px 12px;
    font-size: 12.5px;
    line-height: 1.55;
    margin-top: 10px;
  }

  .feedback.show { display: block; animation: drop 0.2s ease; }

  @keyframes drop {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: none; }
  }

  .feedback.ok { background: var(--ok-bg); border: 1px solid var(--ok-bd); color: var(--ok); }
  .feedback.bad { background: var(--bad-bg); border: 1px solid var(--bad-bd); color: var(--bad); }
  .feedback strong { font-weight: 700; }

  .actions {
    display: flex;
    justify-content: center;
    margin-top: 12px;
    min-height: 38px;
  }

  .btn {
    padding: 9px 18px;
    border-radius: var(--r);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--primary);
    font-family: inherit;
    transition: all 0.15s ease;
  }

  .btn:hover { background: var(--gray); border-color: var(--muted); }
  .btn:focus-visible { outline: 2px solid var(--accent-d); outline-offset: 2px; }

  @media (max-width: 560px) {
    body { padding: 10px 8px; }
    .option { font-size: 12.5px; }
  }
</style>
</head>
<body>

<div class="container">


  <div class="options" id="options"></div>

  <div class="feedback" id="feedback"></div>

  <div class="actions">
    <button class="btn" id="retryBtn" style="display:none" onclick="resetTask()">Пройти заново</button>
  </div>

</div>

<script>
  const OPTIONS = [
    {
      text: '«Подрядчик обязуется соблюдать все требования природоохранного законодательства при транспортировке отходов».',
      ok: false,
      fb: 'Общая фраза. Если подрядчик рассыпет отходы, завод будет ссылаться на этот пункт, но доказать вину подрядчика и избежать штрафа будет сложно: в формулировке нет конкретных действий.'
    },
    {
      text: '«Подрядчик обязуется использовать герметичные кузова, не допускать просыпания отходов на территории завода и за ее пределами, а также предоставлять акты передачи отходов в течение 3 дней».',
      ok: true,
      fb: 'Конкретные действия, привязанные к значимому аспекту – потери при транспортировке – и к обязательству по учету отходов. Такую формулировку можно проверить и потребовать исполнить.'
    },
    {
      text: '«Подрядчик обязуется сортировать отходы на своем полигоне в соответствии с внутренними правилами».',
      ok: false,
      fb: 'Вы не можете контролировать, что подрядчик делает на своем полигоне. Требование должно касаться того, что происходит на вашей территории и в момент передачи отходов.'
    }
  ];

  let order = [];
  let solved = false;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function render() {
    const wrap = document.getElementById('options');
    wrap.innerHTML = '';
    order.forEach((optIdx, pos) => {
      const b = document.createElement('button');
      b.className = 'option';
      b.dataset.idx = optIdx;
      b.innerHTML = `<span class="option-num"><span>${pos + 1}</span></span><span>${OPTIONS[optIdx].text}</span>`;
      b.onclick = () => pick(b, optIdx);
      wrap.appendChild(b);
    });
  }

  function pick(btn, optIdx) {
    if (solved) return;
    const data = OPTIONS[optIdx];
    const fb = document.getElementById('feedback');

    if (data.ok) {
      solved = true;
      btn.classList.add('correct');
      document.querySelectorAll('.option').forEach(o => o.disabled = true);
      fb.className = 'feedback ok show';
      fb.innerHTML = '<strong>Верно.</strong> ' + data.fb;
      document.getElementById('retryBtn').style.display = 'inline-block';
    } else {
      btn.classList.add('wrong');
      btn.disabled = true;
      fb.className = 'feedback bad show';
      fb.innerHTML = '<strong>Ошибка.</strong> ' + data.fb + ' Выберите другую формулировку.';
    }
    resizeIframe();
  }

  function resetTask() {
    solved = false;
    order = shuffle([0, 1, 2]);
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').innerHTML = '';
    document.getElementById('retryBtn').style.display = 'none';
    render();
    resizeIframe();
  }

  function resizeIframe() {
    if (window.parentIFrame && typeof window.parentIFrame.size === 'function') {
      window.parentIFrame.size();
    }
  }

  window.addEventListener('load', () => {
    order = shuffle([0, 1, 2]);
    render();
    resizeIframe();
    setTimeout(resizeIframe, 200);
  });

  if ('ResizeObserver' in window) {
    const container = document.querySelector('.container');
    if (container) {
      let t;
      new ResizeObserver(() => {
        clearTimeout(t);
        t = setTimeout(resizeIframe, 50);
      }).observe(container);
    }
  }
</script>

</body>
</html>
