<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хэллоуинская Жеребьевка Костюмов 🎃</title>
    <style>
        body {
            background-color: #131316;
            color: #f5f5f7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1c1c21;
            padding: 30px;
            border-radius: 16px;
            border: 2px solid #ff793f;
            box-shadow: 0 8px 32px rgba(255, 121, 63, 0.2);
        }
        h1 { color: #ff793f; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px; }
        .subtitle { color: #8e8e93; margin-bottom: 25px; }
        input {
            padding: 14px;
            width: 80%;
            background: #2c2c35;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            text-align: center;
            outline: none;
            margin-bottom: 15px;
        }
        input:focus { border-color: #ff793f; }
        button {
            padding: 14px 28px;
            background: #ff793f;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s ease;
        }
        button:hover { background: #cd6133; }
        button:disabled { background: #444; color: #888; cursor: not-allowed; }
        
        #wheel-wrapper {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 30px auto;
            display: none;
        }
        canvas {
            border-radius: 50%;
            border: 5px solid #ff793f;
            box-shadow: 0 0 20px rgba(255,121,63,0.4);
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1);
        }
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #ff5252;
            z-index: 10;
        }
        #result-box {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #2c2c35;
            border-radius: 12px;
            border: 1px dashed #ff793f;
        }
        .costume-title { font-size: 28px; color: #ff9f43; font-weight: bold; margin: 10px 0; }
        .costume-icon { font-size: 50px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Halloween Wheel</h1>
    <p class="subtitle">Узнай свой секретный костюм на вечеринку</p>

    <div id="auth-block">
        <input type="text" id="username" placeholder="Введите ваше имя или @никнейм" autocomplete="off">
        <br>
        <button id="auth-btn" onclick="startGame()">Войти в комнату</button>
    </div>

    <div id="wheel-wrapper">
        <div class="pointer"></div>
        <canvas id="wheel" width="320" height="320"></canvas>
        <br><br>
        <button id="spin-btn" onclick="spinWheel()">Крутить колесо!</button>
    </div>

    <div id="result-box">
        <div id="res-user" style="color:#aaa;"></div>
        <div class="costume-icon" id="res-icon">🎃</div>
        <div class="costume-title" id="res-text">Костюм</div>
        <p style="margin:0; color:#8e8e93;">Этот костюм закреплен за вашим именем!</p>
    </div>
</div>

<script>
    // Массив костюмов (14 уникальных ролей)
    const allCostumes = [
        { text: "Привидение", icon: "👻" },
        { text: "Клоун", icon: "🤡" },
        { text: "Вампир", icon: "🧛" },
        { text: "Черный кот", icon: "🐈‍⬛" },
        { text: "Ведьма(к)", icon: "🧙‍♀️" },
        { text: "Зомби/мумия", icon: "🧟" },
        { text: "Харли Квин/Уэнсдей/Джокер/Дэдпул", icon: "🃏" },
        { text: "Чёртик", icon: "😈" },
        { text: "Ворон", icon: "🐦‍⬛" },
        { text: "Демон", icon: "👹" },
        { text: "Хеллбой", icon: "🔥" },
        { text: "Снежный человек", icon: "👣" },
        { text: "Жаба", icon: "🐸" },
        { text: "Кикимора/леший/русалка/водяной", icon: "🧜‍♀️" }
    ];

    let currentUser = "";
    let chosenCostume = null;

    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');

    // Функция генерации уникального числа на основе букв имени
    function getHash(str) {
        let hash = 0;
        const cleanStr = str.trim().toLowerCase();
        for (let i = 0; i < cleanStr.length; i++) {
            hash = cleanStr.charCodeAt(i) + ((hash << 5) - hash);
        }
        return Math.abs(hash);
    }

    function startGame() {
        const input = document.getElementById('username').value.trim();
        if (!input) return alert("Введите имя!");
        currentUser = input;

        // Магический хэш привязывает имя к конкретному индексу в массиве костюмов
        const hash = getHash(currentUser);
        const index = hash % allCostumes.length;
        chosenCostume = allCostumes[index];

        document.getElementById('auth-block').style.display = 'none';
        document.getElementById('wheel-wrapper').style.display = 'block';
        drawWheel();
    }

    function drawWheel() {
        const segments = 10; 
        const arc = Math.PI / (segments / 2);
        const colors = ["#1e1426", "#d35400", "#2c1a3a", "#e67e22", "#341f97"];

        for (let i = 0; i < segments; i++) {
            ctx.beginPath();
            ctx.fillStyle = colors[i % colors.length];
            ctx.moveTo(160, 160);
            ctx.arc(160, 160, 160, i * arc, (i + 1) * arc);
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#ff793f";
            ctx.stroke();

            ctx.save();
            ctx.fillStyle = "#fff";
            ctx.font = "bold 22px sans-serif";
            ctx.translate(160, 160);
            ctx.rotate(i * arc + arc / 2);
            ctx.fillText("🎃", 100, 10);
            ctx.restore();
        }
    }

    function spinWheel() {
        document.getElementById('spin-btn').disabled = true;

        // Эффект случайного вращения колеса (всегда останавливается красиво)
        const randomDegrees = Math.floor(3600 + Math.random() * 1800);
        canvas.style.transform = `rotate(${randomDegrees}deg)`;

        setTimeout(() => {
            document.getElementById('wheel-wrapper').style.display = 'none';
            document.getElementById('res-user').innerText = `${currentUser.toUpperCase()}, ВАШ КОСТЮМ:`;
            document.getElementById('res-icon').innerText = chosenCostume.icon;
            document.getElementById('res-text').innerText = chosenCostume.text;
            document.getElementById('result-box').style.display = 'block';
        }, 4000);
    }
</script>
</body>
</html>
