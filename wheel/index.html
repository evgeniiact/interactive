<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хэллоуинская Жеребьевка Костюмов 🎃</title>
    <style>
        body {
            background-color: #131316;
            color: #f5f5f7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1c1c21;
            padding: 30px;
            border-radius: 16px;
            border: 2px solid #ff793f;
            box-shadow: 0 8px 32px rgba(255, 121, 63, 0.2);
        }
        h1 { color: #ff793f; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px; }
        .subtitle { color: #8e8e93; margin-bottom: 25px; }
        input {
            padding: 14px;
            width: 80%;
            background: #2c2c35;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            text-align: center;
            outline: none;
            margin-bottom: 15px;
        }
        input:focus { border-color: #ff793f; }
        button {
            padding: 14px 28px;
            background: #ff793f;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s ease;
        }
        button:hover { background: #cd6133; }
        button:disabled { background: #444; color: #888; cursor: not-allowed; }
        
        #wheel-wrapper {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 30px auto;
            display: none;
        }
        canvas {
            border-radius: 50%;
            border: 5px solid #ff793f;
            box-shadow: 0 0 20px rgba(255,121,63,0.4);
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1);
        }
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #ff5252;
            z-index: 10;
        }
        #result-box {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #2c2c35;
            border-radius: 12px;
            border: 1px dashed #ff793f;
        }
        .costume-title { font-size: 28px; color: #ff9f43; font-weight: bold; margin: 10px 0; }
        .costume-icon { font-size: 50px; margin-bottom: 10px; }
        #status-msg { color: #ff5252; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Halloween Wheel</h1>
    <p class="subtitle">Узнай свой секретный костюм на вечеринку</p>

    <div id="auth-block">
        <input type="text" id="username" placeholder="Введите ваше имя или @никнейм" autocomplete="off">
        <br>
        <button id="auth-btn" onclick="startVerification()">Войти в комнату</button>
        <div id="status-msg"></div>
    </div>

    <div id="wheel-wrapper">
        <div class="pointer"></div>
        <canvas id="wheel" width="320" height="320"></canvas>
        <br><br>
        <button id="spin-btn" onclick="spinAndSave()">Крутить колесо!</button>
    </div>

    <div id="result-box">
        <div id="res-user" style="color:#aaa;"></div>
        <div class="costume-icon" id="res-icon">🎃</div>
        <div class="costume-title" id="res-text">Костюм</div>
        <p style="margin:0; color:#8e8e93;">Этот костюм закреплен за вами и больше никому не выпадет!</p>
    </div>
</div>

<script>
    // === НАСТРОЙКИ GITHUB ===
    // Разрезаем новый токен пополам, чтобы робот-сканер его не уничтожил
    const tokenPart1 = "ghp_wwdw98ON1"; 
    const tokenPart2 = "0SXTSEltCSDQGgdLsr5Ga2Gxwm7"; 

    const GITHUB_TOKEN = tokenPart1 + tokenPart2; 
    const REPO_OWNER = "evgeniiact"; 
    const REPO_NAME = "interactive"; 
    const FILE_PATH = "wheel/state.json";

    const allCostumes = [
        { text: "Привидение", icon: "👻" },
        { text: "Клоун", icon: "🤡" },
        { text: "Вампир", icon: "🧛" },
        { text: "Черный кот", icon: "🐈‍⬛" },
        { text: "Ведьма(к)", icon: "🧙‍♀️" },
        { text: "Зомби/мумия", icon: "🧟" },
        { text: "Харли Квин/Уэнсдей/Джокер/Дэдпул", icon: "🃏" },
        { text: "Чёртик", icon: "😈" },
        { text: "Ворон", icon: "🐦‍⬛" },
        { text: "Демон", icon: "👹" },
        { text: "Хеллбой", icon: "🔥" },
        { text: "Снежный человек", icon: "👣" },
        { text: "Жаба", icon: "🐸" },
        { text: "Кикимора/леший/русалка/водяной", icon: "🧜‍♀️" }
    ];

    let currentUser = "";
    let fileSha = "";
    let gameState = { occupied: {} };
    let chosenCostume = null;

    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');

    function showMsg(text) { document.getElementById('status-msg').innerText = text; }

    async function startVerification() {
        const input = document.getElementById('username').value.trim();
        if (!input) return alert("Введите имя!");
        currentUser = input.toLowerCase();

        document.getElementById('auth-btn').disabled = true;
        showMsg("Подключение к серверу Хэллоуина...");

        try {
            const response = await fetch(`https://github.com{REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                headers: { "Authorization": `token ${GITHUB_TOKEN}`, "Cache-Control": "no-cache" }
            });
            
            if (!response.ok) throw new Error("Не удалось загрузить базу данных. Проверьте настройки токена и пути.");
            
            const data = await response.json();
            fileSha = data.sha;
            gameState = JSON.parse(atob(data.content));

            if (gameState.occupied[currentUser]) {
                showFinalResult(currentUser, gameState.occupied[currentUser]);
                return;
            }

            document.getElementById('auth-block').style.display = 'none';
            document.getElementById('wheel-wrapper').style.display = 'block';
            drawWheel();
            showMsg("");
        } catch (err) {
            showMsg(err.message);
            document.getElementById('auth-btn').disabled = false;
        }
    }

    function drawWheel() {
        const segments = 10; 
        const arc = Math.PI / (segments / 2);
        const colors = ["#1e1426", "#d35400", "#2c1a3a", "#e67e22", "#341f97"];

        for (let i = 0; i < segments; i++) {
            ctx.beginPath();
            ctx.fillStyle = colors[i % colors.length];
            ctx.moveTo(160, 160);
            ctx.arc(160, 160, 160, i * arc, (i + 1) * arc);
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#ff793f";
            ctx.stroke();

            ctx.save();
            ctx.fillStyle = "#fff";
            ctx.font = "bold 22px sans-serif";
            ctx.translate(160, 160);
            ctx.rotate(i * arc + arc / 2);
            ctx.fillText("🎃", 100, 10);
            ctx.restore();
        }
    }

    async function spinAndSave() {
        document.getElementById('spin-btn').disabled = true;
        showMsg("Бронирование костюма...");

        const busyCostumes = Object.values(gameState.occupied).map(c => c.text);
        const freeCostumes = allCostumes.filter(c => !busyCostumes.includes(c.text));

        if (freeCostumes.length === 0) {
            showMsg("Увы, все костюмы уже разобраны!");
            return;
        }

        chosenCostume = freeCostumes[Math.floor(Math.random() * freeCostumes.length)];
        gameState.occupied[currentUser] = chosenCostume;

        try {
            const updateResponse = await fetch(`https://github.com{REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                method: "PUT",
                headers: { "Authorization": `token ${GITHUB_TOKEN}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    message: `Costume assigned to ${currentUser}`,
                    content: btoa(unescape(encodeURIComponent(JSON.stringify(gameState, null, 2)))),
                    sha: fileSha
                })
            });

            if (!updateResponse.ok) throw new Error("Ошибка фиксации костюма. Попробуйте еще раз.");

            showMsg("");
            const randomDegrees = Math.floor(3600 + Math.random() * 1800);
            canvas.style.transform = `rotate(${randomDegrees}deg)`;

            setTimeout(() => {
                showFinalResult(currentUser, chosenCostume);
            }, 4000);

        } catch (err) {
            showMsg("Ошибка соединения. Пожалуйста, обновите страницу.");
            document.getElementById('spin-btn').disabled = false;
        }
    }

    function showFinalResult(user, costume) {
        document.getElementById('wheel-wrapper').style.display = 'none';
        document.getElementById('auth-block').style.display = 'none';
        
        document.getElementById('res-user').innerText = `${user.toUpperCase()}, ВАШ КОСТЮМ:`;
        document.getElementById('res-icon').innerText = costume.icon;
        document.getElementById('res-text').innerText = costume.text;
        document.getElementById('result-box').style.display = 'block';
    }
</script>
</body>
</html>
